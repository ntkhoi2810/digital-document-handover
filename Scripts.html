<script>
(() => {
  'use strict';
  const state = { boot: null, documents: [], transactions: [], notifications: [], pending: [], adminDocuments: [], workflows: [], types: [], serviceTimer: null, toastTimer: null, bootFresh: false, lastRefreshAt: 0, language: localStorage.getItem('ddh-language') === 'en' ? 'en' : 'vi' };
  const translations = {
    'Đang đăng nhập…':'Signing in…','Sổ giao nhận hồ sơ':'Document Submission & Collection','Văn phòng Khoa':'Faculty Office','Trang chủ':'Home','Nộp & nhận':'Submit & Collect','Hồ sơ của tôi':'My Documents','Lịch sử':'History','Thông báo':'Notifications','Tài khoản':'Account','Tổng quan':'Overview','Chờ xác nhận':'Pending Review','Hồ sơ':'Documents','Danh mục':'Catalog','Tiếp sinh viên':'Student Service','Sinh viên':'Students','Báo cáo':'Reports','Cài đặt':'Settings','Đang tải':'Loading','Mở menu':'Open menu','Tạo yêu cầu':'Create Request','Lịch sử yêu cầu':'Request History','MSSV lấy từ email trường, không sửa được.':'Student ID is taken from your university email and cannot be changed.','Chỉ xác nhận khi đã đối chiếu sinh viên và giấy tờ thực tế.':'Confirm only after verifying the student and physical documents.','Hồ sơ gần đây':'Recent Documents','Xem tất cả':'View All','Nộp hoặc nhận giấy tờ':'Submit or Collect Documents','Chọn giấy tờ rồi gửi yêu cầu. Yêu cầu hoàn tất khi cán bộ xác nhận tại quầy.':'Select documents and submit a request. Staff will confirm it at the counter.','Nhập họ tên và lớp trước khi gửi yêu cầu.':'Enter your name and class before submitting a request.','Cập nhật':'Update','Nộp hồ sơ':'Document Submission','Nhận hồ sơ':'Document Collection','Bổ sung giấy tờ':'Submit Supplementary Documents','Loại yêu cầu':'Request type','Ghi chú':'Note','Không bắt buộc':'Optional','Chọn ít nhất một giấy tờ.':'Select at least one document.','Gửi yêu cầu':'Submit Request','Tìm theo mã hoặc tên hồ sơ':'Search by code or document name','Email TDTU':'TDTU Email','Mã số sinh viên':'Student ID','Họ và tên':'Full Name','Lớp':'Class','Lưu':'Save','Quản lý & cập nhật tiến độ hồ sơ':'Manage Documents and Track Progress','Tra cứu, thêm hồ sơ trực tiếp tại văn phòng hoặc cập nhật trạng thái hàng loạt.':'Search, add documents at the office, or update multiple statuses.','Quản lý hồ sơ':'Manage Documents','Mở danh sách':'Open List','Tìm theo MSSV, họ tên hoặc mã yêu cầu':'Search by student ID, name, or request code','Tất cả trạng thái':'All statuses','Tìm kiếm':'Search','Thêm hồ sơ':'Add Document','Đã chọn 0 hồ sơ':'0 documents selected','Cập nhật trạng thái':'Update Status','Bỏ chọn':'Clear Selection','Danh mục hồ sơ':'Document Catalog','Thêm loại':'Add Type','Quy trình xử lý':'Workflows','Tạo quy trình':'Create Workflow','Ghi nhận trực tiếp':'Live Session','Ghi nhận thủ công':'Manual Entry','Bắt đầu':'Start','Kết thúc':'End','Nội dung trao đổi':'Discussion','Kết quả xử lý':'Outcome','Lưu buổi tiếp':'Save Session','Lịch sử tiếp sinh viên':'Student Service History','Tìm sinh viên hoặc nội dung':'Search students or topics','Email hoặc MSSV':'Email or Student ID','MSSV, họ tên, lớp hoặc email':'Student ID, name, class, or email','Từ ngày':'From','Đến ngày':'To','Xem báo cáo':'View Report','Xuất CSV':'Export CSV','Cài đặt ứng dụng':'Application Settings','Tên ứng dụng':'Application Name','Tên văn phòng':'Office Name','Kiểm tra hệ thống':'System Check','Chạy kiểm tra':'Run Check','Đang xử lý…':'Processing…','Đang xác nhận…':'Confirming…','Đã hoàn thành':'Completed','Đã bàn giao':'Handed Over','Đã tiếp nhận':'Received','Đang kiểm tra hồ sơ':'Under Document Review','Yêu cầu bổ sung':'Supplement Required','Đang xử lý':'Processing','Đang trình duyệt':'Under Review','Chờ phê duyệt':'Awaiting Approval','Chờ sinh viên đến nhận':'Ready for Collection','Đã hủy':'Cancelled','Chưa có hồ sơ.':'No documents yet.','Chưa có yêu cầu nào.':'No requests yet.','Chưa có thông báo nào.':'No notifications yet.','Không có dữ liệu.':'No data.','Không có yêu cầu nào đang chờ.':'No requests are pending.','Loại hồ sơ':'Document Type','Hình thức':'Handling','Sinh viên nộp':'Student submits','Sinh viên nhận':'Student collects','Cả nộp và nhận':'Submission and collection','Kiểu theo dõi':'Tracking','Chỉ ghi nhận giao nhận':'Record handover only','Có tiến độ xử lý':'Track processing progress','Tùy chọn nâng cao':'Advanced Options','Mô tả':'Description','Quy trình':'Workflow','Dùng quy trình chuẩn':'Use standard workflow','Thứ tự':'Order','Đang sử dụng':'Active','Ngừng sử dụng':'Inactive','Lưu loại hồ sơ':'Save Document Type','Phiên bản':'Version','Các bước xử lý':'Workflow Steps','Tên bước':'Step name','Nhãn trạng thái':'Status label','Thêm bước':'Add Step','Xác nhận':'Confirm','Từ chối':'Reject','Đã đọc':'Read','Xem hồ sơ':'View Document','Ghi nhận':'Recorded','Dự kiến xong':'Expected completion','Tiến độ':'Progress','Không vào được':'Unable to open','Đăng nhập bằng tài khoản TDTU rồi tải lại trang.':'Sign in with your TDTU account and reload the page.','Tải lại':'Reload','Student':'Student'
  };
  const originalText = new WeakMap();
  function translateNode(node) {
    if (node.nodeType !== Node.TEXT_NODE || !node.nodeValue.trim()) return;
    if (!originalText.has(node)) originalText.set(node, node.nodeValue);
    const source = originalText.get(node).trim();
    const translated = state.language === 'en' && translations[source] ? originalText.get(node).replace(source, translations[source]) : originalText.get(node);
    if (node.nodeValue !== translated) node.nodeValue = translated;
  }
  function applyLanguage() {
    document.documentElement.lang = state.language;
    document.title = state.language === 'en' ? 'Document Submission & Collection - TDTU' : 'Sổ giao nhận hồ sơ - TDTU';
    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) translateNode(walker.currentNode);
    const button = $('#language-toggle');
    if (button) { button.textContent = state.language === 'vi' ? 'EN' : 'VI'; button.setAttribute('aria-label', state.language === 'vi' ? 'Switch to English' : 'Chuyển sang tiếng Việt'); }
    const locale = state.language === 'en' ? 'en-US' : 'vi-VN';
    document.querySelectorAll('.kpi strong').forEach(el => { const value = Number(el.textContent.replace(/[^0-9.-]/g,'')); if (Number.isFinite(value)) el.textContent = value.toLocaleString(locale); });
  }
  new MutationObserver(records => records.forEach(record => { if (record.type === 'characterData') translateNode(record.target); else record.addedNodes.forEach(node => { if (node.nodeType === Node.TEXT_NODE) translateNode(node); else if (node.nodeType === Node.ELEMENT_NODE) { const walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT); while (walker.nextNode()) translateNode(walker.currentNode); } }); })).observe(document.body, {subtree:true,childList:true,characterData:true});
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const localized = (vi, en) => state.language === 'en' && en ? en : (vi || '');
  const fmtDate = value => value ? new Intl.DateTimeFormat(state.language === 'en' ? 'en-US' : 'vi-VN', {dateStyle:'short', timeStyle:'short', timeZone:'Asia/Ho_Chi_Minh'}).format(new Date(value)) : '—';
  const fmtDay = value => value ? new Intl.DateTimeFormat(state.language === 'en' ? 'en-US' : 'vi-VN', {dateStyle:'short', timeZone:'Asia/Ho_Chi_Minh'}).format(new Date(value)) : '—';
  const displayTypeName = (id, fallback) => { const type = (state.boot?.types || state.types).find(item => item.typeId === id); return localized(type?.name || fallback, type?.nameEn); };
  const displayStatus = value => localized(value, translations[value]);
  const typeLabel = value => ({SUBMIT:'Nộp hồ sơ', RECEIVE:'Nhận hồ sơ', SUPPLEMENT:'Bổ sung giấy tờ'})[value] || value;
  const statusLabel = value => ({PENDING:'Chờ xác nhận', PARTIAL:'Đã xác nhận một phần', COMPLETED:'Hoàn tất', REJECTED:'Bị từ chối', APPROVED:'Đã xác nhận'})[value] || value;
  const statusClass = value =>
    /APPROVED|COMPLETED|Đã hoàn thành|Đã bàn giao|Đang sử dụng/.test(value) ? 'ok' :
    /REJECTED|Đã hủy|Ngừng sử dụng/.test(value) ? 'bad' :
    /PENDING|PARTIAL|Yêu cầu bổ sung|Chờ sinh viên đến nhận/.test(value) ? 'act' :
    /Đang|Chờ phê duyệt|Đã tiếp nhận/.test(value) ? 'prog' : '';
  const rowArrowSvg = '<svg class="row-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>';

  function api(name, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(normalizeError(error)))
        [name](...args);
    });
  }

  function normalizeError(error) {
    const raw = String(error && error.message ? error.message : error || 'Có lỗi xảy ra.');
    const clean = raw.replace(/^Exception:\s*/i, '');
    const parts = clean.split('|');
    const err = new Error(parts.length > 1 ? parts.slice(1).join('|') : clean);
    err.code = parts.length > 1 ? parts[0] : 'ERROR';
    return err;
  }

  function setBusy(button, busy, label = 'Đang xử lý…') {
    if (!button) return;
    if (busy) { button.dataset.original = button.textContent; button.textContent = label; button.disabled = true; }
    else { button.textContent = button.dataset.original || button.textContent; button.disabled = false; }
  }

  function toast(message, error = false) {
    const el = $('#toast'); el.textContent = message; el.className = 'toast' + (error ? ' error' : '');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  function showAlert(message, success = false) {
    const el = $('#alert'); el.textContent = message; el.className = 'alert' + (success ? ' success' : '');
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function hideAlert() { $('#alert').classList.add('hidden'); }

  function openModal(html) { $('#modal-content').innerHTML = html; $('#modal').classList.remove('hidden'); }
  function closeModal() { $('#modal').classList.add('hidden'); $('#modal-content').innerHTML = ''; }

  function updateAvatar(name) {
    const el = $('#user-avatar');
    if (!el) return;
    const token = String(name || 'T').trim().split(/\s+/).at(-1) || 'T';
    el.textContent = token.charAt(0).toUpperCase();
  }

  async function initialize() {
    bindGlobalEvents();
    applyLanguage();
    try {
      state.boot = await api('getBootstrap');
      state.documents = Array.isArray(state.boot.documents) ? state.boot.documents : [];
      state.pending = Array.isArray(state.boot.pendingTransactions) ? state.boot.pendingTransactions : [];
      state.bootFresh = true;
      state.lastRefreshAt = Date.now();
      renderShell();
      $('#loading').classList.add('hidden');
      $('#app').classList.remove('hidden');
      const initial = window.INITIAL_VIEW === 'transaction' && state.boot.identity.role === 'STUDENT' ? 'student-transaction' : (state.boot.identity.role === 'ADMIN' ? 'admin-home' : 'student-home');
      await navigate(initial);
    } catch (error) {
      $('#loading').innerHTML = `<div class="access-error"><h2>Không vào được</h2><p>${escapeHtml(error.message)}</p><p>Đăng nhập bằng tài khoản TDTU rồi tải lại trang.</p><button class="button primary" onclick="location.reload()">Tải lại</button></div>`;
    }
  }

  function renderShell() {
    const {identity, profile, appName, officeName, dashboard} = state.boot;
    $('#app').dataset.role = identity.role;
    const normalizedAppName = (!appName || ['Hệ thống Giao nhận Hồ sơ Sinh viên', 'Giao nhận hồ sơ'].includes(appName)) ? 'Sổ giao nhận hồ sơ' : appName;
    $('#brand-title').textContent = normalizedAppName;
    $('#office-name').textContent = officeName;
    $('#user-email').textContent = identity.email;
    const name = identity.role === 'ADMIN' ? (identity.name || identity.email.split('@')[0]) : (profile?.fullName || 'Sinh viên TDTU');
    $('#user-name').textContent = name;
    updateAvatar(name);
    $('#student-nav').classList.toggle('hidden', identity.role !== 'STUDENT');
    $('#admin-nav').classList.toggle('hidden', identity.role !== 'ADMIN');
    if (identity.role === 'STUDENT') {
      renderStudentKpis(dashboard); renderProfile();
      $('#notice-badge').textContent = dashboard.unreadNotifications || 0;
      $('#notice-badge').classList.toggle('hidden', !dashboard.unreadNotifications);
      $('#profile-required').classList.toggle('hidden', Boolean(profile));
    } else {
      renderAdminKpis(dashboard);
    }
  }

  function bindGlobalEvents() {
    $('#language-toggle')?.addEventListener('click', () => { state.language = state.language === 'vi' ? 'en' : 'vi'; localStorage.setItem('ddh-language', state.language); applyLanguage(); });
    document.addEventListener('click', event => {
      const nav = event.target.closest('[data-view]'); if (nav) navigate(nav.dataset.view);
      const go = event.target.closest('[data-go]'); if (go) navigate(go.dataset.go);
      const sidebar = $('.sidebar');
      if (sidebar && sidebar.classList.contains('open') && !event.target.closest('.sidebar') && !event.target.closest('#mobile-menu')) sidebar.classList.remove('open');
    });
    window.addEventListener('resize', syncSegmented);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !$('#modal').classList.contains('hidden')) closeModal();
    });
    $('#mobile-menu').addEventListener('click', () => $('.sidebar').classList.toggle('open'));
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && Date.now() - state.lastRefreshAt > 60000) refreshCurrent();
    });
    $('#modal-close').addEventListener('click', closeModal);
    $('#modal').addEventListener('click', event => { if (event.target === $('#modal')) closeModal(); });
    $('#profile-form').addEventListener('submit', saveProfile);
    $('#transaction-form').addEventListener('submit', submitTransaction);
    $$('input[name="transactionType"]').forEach(input => input.addEventListener('change', () => syncSegmented() || renderTransactionOptions().catch(error => showAlert(error.message))));
    $('#my-document-search').addEventListener('input', renderMyDocuments);
    $('#transaction-options').addEventListener('change', updateTransactionSelection);
    $('#search-admin-documents').addEventListener('click', loadAdminDocuments);
    $('#admin-document-search').addEventListener('keydown', e => { if (e.key === 'Enter') loadAdminDocuments(); });
    $('#new-manual-document').addEventListener('click', showManualDocumentForm);
    $('#batch-documents').addEventListener('click', showBatchDocumentForm);
    $('#clear-document-selection').addEventListener('click', () => { $$('.document-select').forEach(input => { input.checked = false; }); updateDocumentBulkActions(); });
    $('#admin-documents-table').addEventListener('change', event => { if (event.target.matches('.document-select')) updateDocumentBulkActions(); });
    $('#new-type').addEventListener('click', () => showTypeForm());
    $('#new-workflow').addEventListener('click', showWorkflowForm);
    $('#manual-service-form').addEventListener('submit', saveManualService);
    $('#service-search').addEventListener('input', loadServiceHistory);
    $('#search-students').addEventListener('click', loadStudents);
    $('#run-report').addEventListener('click', loadReport);
    $('#export-report').addEventListener('click', exportReport);
    $('#settings-form').addEventListener('submit', saveSettings);
    $('#health-check').addEventListener('click', runHealthCheck);
    $('#pending-search').addEventListener('input', renderPendingTransactions);
  }

  const viewMeta = {
    'student-home':['Trang chủ',''], 'student-transaction':['Tạo yêu cầu',''],
    'student-documents':['Hồ sơ của tôi',''], 'student-history':['Lịch sử yêu cầu',''],
    'student-notifications':['Thông báo',''], 'student-profile':['Tài khoản','MSSV lấy từ email trường, không sửa được.'],
    'admin-home':['Tổng quan',''], 'admin-pending':['Chờ xác nhận','Chỉ xác nhận khi đã đối chiếu sinh viên và giấy tờ thực tế.'],
    'admin-documents':['Hồ sơ',''], 'admin-catalog':['Danh mục',''],
    'admin-service':['Tiếp sinh viên',''], 'admin-students':['Sinh viên',''],
    'admin-reports':['Báo cáo',''], 'admin-settings':['Cài đặt','']
  };

  async function navigate(view) {
    if (!document.getElementById(view)) return;
    $$('.view').forEach(el => el.classList.toggle('active-view', el.id === view));
    $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    $('.sidebar').classList.remove('open');
    $('#page-title').textContent = viewMeta[view]?.[0] || '';
    $('#page-subtitle').textContent = viewMeta[view]?.[1] || '';
    hideAlert();
    requestAnimationFrame(syncSegmented);
    try { await loadView(view); } catch (error) { showAlert(error.message); }
  }

  function syncSegmented() {
    $$('.segmented').forEach(group => {
      let indicator = group.querySelector('.seg-indicator');
      if (!indicator) {
        indicator = document.createElement('span');
        indicator.className = 'seg-indicator';
        indicator.setAttribute('aria-hidden', 'true');
        group.prepend(indicator);
        group.classList.add('has-indicator');
      }
      const label = group.querySelector('input:checked')?.closest('label');
      if (!label || !label.offsetWidth) return;
      indicator.style.width = label.offsetWidth + 'px';
      indicator.style.transform = 'translateX(' + label.offsetLeft + 'px)';
    });
  }

  async function loadView(view) {
    const map = {
      'student-home': loadStudentHome, 'student-transaction': renderTransactionOptions, 'student-documents': loadMyDocuments,
      'student-history': loadMyTransactions, 'student-notifications': loadNotifications,
      'admin-home': loadAdminHome, 'admin-pending': loadPending, 'admin-documents': loadAdminDocuments,
      'admin-catalog': loadCatalog, 'admin-service': loadService, 'admin-students': loadStudents,
      'admin-reports': loadReport, 'admin-settings': loadSettings
    };
    if (map[view]) await map[view]();
    state.lastRefreshAt = Date.now();
  }

  async function refreshCurrent() { const current = $('.view.active-view'); if (current) await loadView(current.id); }

  function renderStudentKpis(data) {
    $('#student-kpis').innerHTML = kpis([
      ['Đang xử lý', data.processing, 'kpi-prog'], ['Cần bổ sung', data.supplement, 'kpi-bad'], ['Đã hoàn thành', data.completed, 'kpi-ok'], ['Chờ đến nhận', data.waitingPickup, 'kpi-act']
    ]);
  }
  function renderAdminKpis(data) {
    $('#admin-kpis').innerHTML = kpis([
      ['Chờ xác nhận', data.pendingTransactions, 'kpi-act'], ['Đang lưu giữ', data.storedDocuments, 'kpi-store'], ['Đang xử lý', data.processing, 'kpi-prog'], ['Cần bổ sung', data.supplement, 'kpi-bad']
    ]);
    const pendingBadge = $('#pending-badge');
    if (pendingBadge) {
      pendingBadge.textContent = data.pendingTransactions || 0;
      pendingBadge.classList.toggle('hidden', !data.pendingTransactions);
    }
  }
  const kpis = items => items.map(item => `<div class="kpi${item[2] ? ' ' + item[2] : ''}"><div class="kpi-head"><span>${escapeHtml(item[0])}</span><i class="kpi-dot" aria-hidden="true"></i></div><strong>${Number(item[1] || 0).toLocaleString('vi-VN')}</strong></div>`).join('');

  function renderProfile() {
    const {identity, profile} = state.boot;
    $('#profile-email').value = identity.email;
    $('#profile-student-id').value = identity.studentId || 'Chưa xác định';
    $('#profile-full-name').value = profile?.fullName || '';
    $('#profile-class').value = profile?.className || '';
  }

  async function saveProfile(event) {
    event.preventDefault(); const button = event.submitter; setBusy(button, true);
    try {
      state.boot.profile = await api('saveStudentProfile', {fullName:$('#profile-full-name').value, className:$('#profile-class').value});
      $('#user-name').textContent = state.boot.profile.fullName;
      updateAvatar(state.boot.profile.fullName);
      $('#profile-required').classList.add('hidden');
      toast('Đã lưu.');
    } catch (error) { showAlert(error.message); } finally { setBusy(button, false); }
  }

  function renderStudentHomeView(dashboard, documents) {
    renderStudentKpis(dashboard);
    const fullName = state.boot.profile?.fullName?.trim() || '';
    const firstName = fullName ? fullName.split(/\s+/).at(-1) : 'bạn';
    $('#page-title').textContent = `Chào ${firstName}`;
    $('#student-home-note').innerHTML = dashboard.supplement > 0 ? `<span>Bạn có ${Number(dashboard.supplement).toLocaleString('vi-VN')} hồ sơ cần bổ sung.</span><button class="link-button" data-go="student-documents">Xem hồ sơ</button>` : '';
    $('#recent-documents').innerHTML = documents.slice(0,5).map(doc => `<button class="list-item" onclick="window.app.openDocument('${doc.documentId}')"><div><strong>${escapeHtml(displayTypeName(doc.typeId,doc.typeName))}</strong><small><span class="list-code">${escapeHtml(doc.code)}</span><span>Cập nhật ${fmtDate(doc.updatedAt)}</span></small></div><div class="list-item-end"><span class="status ${statusClass(doc.status)}">${escapeHtml(displayStatus(doc.status))}</span>${rowArrowSvg}</div></button>`).join('') || '<div class="empty">Chưa có hồ sơ.</div>';
  }

  async function loadStudentHome() {
    renderStudentHomeView(state.boot.dashboard, state.documents);
    if (state.bootFresh) { state.bootFresh = false; return; }
    const [dashboard, documents] = await Promise.all([api('getMyDashboard'), api('getMyDocuments')]);
    state.boot.dashboard = dashboard; state.documents = documents;
    renderStudentHomeView(dashboard, documents);
  }

  function renderTransactionOptionList() {
    const type = $('input[name="transactionType"]:checked')?.value || 'SUBMIT';
    let options = [];
    if (type === 'SUBMIT') options = state.boot.types.filter(item => ['SUBMIT','BOTH'].includes(item.handoverMode)).map(item => ({id:item.typeId, name:item.name, description:item.description, field:'typeId'}));
    else if (type === 'RECEIVE') options = state.boot.types.filter(item => ['RECEIVE','BOTH'].includes(item.handoverMode)).map(item => ({id:item.typeId, name:item.name, description:item.description, field:'typeId'}));
    else options = state.documents.filter(doc => !['Đã bàn giao','Đã hủy'].includes(doc.status)).map(doc => ({id:doc.documentId, name:doc.typeName, description:`${doc.code} - ${doc.status}`, field:'documentId'}));
    $('#transaction-options').innerHTML = options.map(item => `<label class="check-option"><input type="checkbox" value="${escapeHtml(item.id)}" data-field="${item.field}"><span><strong>${escapeHtml(item.name)}</strong>${item.description?`<small>${escapeHtml(item.description)}</small>`:''}</span></label>`).join('') || '<div class="empty">Chưa có giấy tờ nào để chọn.</div>';

  async function openDocument(documentId) {
    try {
      const doc = await api('getDocumentDetail', documentId);
      const total = doc.steps.length || 1;
      const doneCount = doc.steps.filter(step => step.state === 'DONE').length;
      const currentIndex = doc.steps.findIndex(step => step.state === 'CURRENT');
      const stepNumber = currentIndex >= 0 ? currentIndex + 1 : Math.min(total, Math.max(1, doneCount));
      const timeline = doc.steps.length ? doc.steps.map(step => {
        const event = [...doc.events].reverse().find(evt => evt.toStepId === step.stepId);
        const attention = step.state === 'CURRENT' && doc.status === 'Yêu cầu bổ sung' ? ' attention' : '';
        return `<div class="timeline-step ${step.state.toLowerCase()}${attention}"><strong>${escapeHtml(step.name)}</strong><small>${event ? fmtDate(event.createdAt) : (step.state==='CURRENT'?'Đang làm':'')}</small>${event?.publicNote?`<div class="timeline-note">${escapeHtml(event.publicNote)}</div>`:''}</div>`;
      }).join('') : doc.events.map(evt => `<div class="timeline-step done"><strong>${escapeHtml(evt.status)}</strong><small>${fmtDate(evt.createdAt)}</small>${evt.publicNote?`<div class="timeline-note">${escapeHtml(evt.publicNote)}</div>`:''}</div>`).join('');
      openModal(`<h2 class="detail-title">${escapeHtml(doc.typeName)}</h2><div class="detail-meta"><code>${escapeHtml(doc.code)}</code><span class="status ${statusClass(doc.status)}">${escapeHtml(doc.status)}</span></div><div class="detail-facts"><div><small>Ghi nhận</small><strong>${fmtDay(doc.submittedAt)}</strong></div><div><small>Dự kiến xong</small><strong>${fmtDay(doc.expectedAt)}</strong></div></div><div class="detail-section-head"><span>Tiến độ</span><span>Bước ${stepNumber}/${total}</span></div><div class="timeline">${timeline}</div><p class="detail-updated">Cập nhật ${fmtDate(doc.updatedAt)}</p>`);
    } catch (error) { showAlert(error.message); }
  }

  async function approveTransaction(transactionId, button) {
    const selected = $$(`.pending-item-select[data-transaction-id="${transactionId}"]:checked`);
    if (!selected.length) { toast('Chọn ít nhất một giấy tờ.', true); return; }
    const itemIds = selected.map(input => input.value);
    const documentSelections = {};
    for (const itemId of itemIds) {
      const select = $(`.pickup-document-select[data-item-id="${itemId}"]`);
      if (select) {
        if (!select.value) { toast('Chọn hồ sơ cụ thể cho mục có nhiều hồ sơ.', true); return; }
        documentSelections[itemId] = select.value;
      }
    }
    setBusy(button,true,'Đang xác nhận…');
    try {
      await api('reviewTransactionItems',{itemIds,decision:'APPROVE',note:$(`#review-note-${transactionId}`).value,sendEmail:$(`#review-email-${transactionId}`).checked,documentSelections});
      toast(`Đã xác nhận ${itemIds.length} giấy tờ.`); await loadPending();
    } catch(error) { toast(error.message,true); }
    finally { setBusy(button,false); }
  }

  function reviewItem(itemId, decision) {
    const title = decision === 'APPROVE' ? 'Xác nhận giấy tờ' : 'Từ chối giấy tờ';
    openModal(`<h2>${title}</h2><p>${decision==='APPROVE'?'Xác nhận sau khi đã đối chiếu sinh viên và giấy tờ thực tế tại quầy.':'Ghi lý do để sinh viên biết cần làm gì.'}</p><form id="review-form"><label>Ghi chú</label><textarea id="review-note" rows="4" ${decision==='REJECT'?'required':''}></textarea><label class="check-option"><input id="review-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button ${decision==='APPROVE'?'primary':'danger'}" type="submit">${title}</button></div></form>`);
    $('#review-form').addEventListener('submit', async event => {
      event.preventDefault(); const button=event.submitter; setBusy(button,true);
      try { await api('reviewTransactionItem',{itemId,decision,note:$('#review-note').value,sendEmail:$('#review-email').checked}); closeModal(); toast('Đã cập nhật yêu cầu.'); await loadPending(); }

    });
  }

  async function editDocument(documentId) {

      const steps=(workflow?.steps||doc.steps||[]).map(step=>`<option value="${escapeHtml(step.stepId)}" ${step.stepId===state.adminDocuments.find(x=>x.documentId===documentId)?.currentStepId?'selected':''}>${escapeHtml(step.order+'. '+step.name)}</option>`).join('');

      $('#document-update-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('updateDocumentProgress',{documentId,version:doc.version,stepId:$('#doc-step').value,status:$('#doc-status').value,expectedAt:$('#doc-expected').value,publicNote:$('#doc-public-note').value,internalNote:$('#doc-internal-note').value,sendEmail:$('#doc-send-email').checked});closeModal();toast('Đã cập nhật tiến độ hồ sơ.');await loadAdminDocuments();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});

  async function loadCatalog() {
    const [types,workflows]=await Promise.all([api('listDocumentTypes',true),api('listWorkflows')]);
    state.workflows=workflows; state.types=types; state.boot.types=types.filter(x=>x.active);
    const handoverLabel={SUBMIT:'Nộp',RECEIVE:'Nhận',BOTH:'Nộp và nhận'};
    const handoverClass={SUBMIT:'submit',RECEIVE:'receive',BOTH:'both'};
    $('#document-types-admin').innerHTML=types.map(item=>`<div class="list-item${item.active?'':' inactive-item'}"><div><strong>${escapeHtml(localized(item.name,item.nameEn))}</strong><small><span class="meta-tag ${handoverClass[item.handoverMode]||'both'}">${escapeHtml(handoverLabel[item.handoverMode]||'Nộp và nhận')}</span><span class="meta-tag ${item.tracksProgress?'track':'record'}">${item.tracksProgress?'Theo dõi tiến độ':'Chỉ ghi nhận'}</span><span class="status ${item.active?'ok':'bad'}">${item.active?'Đang sử dụng':'Ngừng sử dụng'}</span></small></div><div class="review-actions"><button class="link-button" onclick="window.app.editType('${escapeHtml(item.typeId)}')">Sửa</button><button class="link-button danger" onclick="window.app.deleteType('${escapeHtml(item.typeId)}')">Xóa</button></div></div>`).join('')||'<div class="empty">Chưa có loại hồ sơ.</div>';
    $('#workflows-admin').innerHTML=workflows.map(w=>`<div class="list-item${w.active?'':' inactive-item'}"><div><strong>${escapeHtml(localized(w.name,w.nameEn))}</strong><small><span class="meta-tag record">Phiên bản ${w.version} - ${w.steps.length} bước</span><span class="status ${w.active?'ok':'bad'}">${w.active?'Đang sử dụng':'Ngừng sử dụng'}</span></small></div><button class="link-button" onclick="window.app.viewWorkflow('${w.workflowVersionId}')">Xem</button></div>`).join('')||'<div class="empty">Chưa có quy trình.</div>';
  }

  function showTypeForm(item={}) {
    const options=state.workflows.map(w=>`<option value="${escapeHtml(w.workflowVersionId)}" ${w.workflowVersionId===item.workflowVersionId?'selected':''}>${escapeHtml(localized(w.name,w.nameEn))} - v${w.version}</option>`).join('');
    const mode=item.handoverMode||'SUBMIT';
    openModal(`<h2>${item.typeId?'Chỉnh sửa':'Thêm'} loại hồ sơ</h2><form id="type-form"><label>Tên loại hồ sơ</label><input id="type-name" value="${escapeHtml(item.name||'')}" required><label>Hình thức</label><select id="type-handover-mode"><option value="SUBMIT" ${mode==='SUBMIT'?'selected':''}>Sinh viên nộp</option><option value="RECEIVE" ${mode==='RECEIVE'?'selected':''}>Sinh viên nhận</option><option value="BOTH" ${mode==='BOTH'?'selected':''}>Cả nộp và nhận</option></select><label>Kiểu theo dõi</label><select id="type-tracking"><option value="NO" ${!item.tracksProgress?'selected':''}>Chỉ ghi nhận giao nhận</option><option value="YES" ${item.tracksProgress?'selected':''}>Có tiến độ xử lý</option></select><details class="advanced-options"><summary>Tùy chọn nâng cao</summary><label>Mô tả</label><textarea id="type-description">${escapeHtml(item.description||'')}</textarea><label>Quy trình</label><select id="type-workflow"><option value="">Dùng quy trình chuẩn</option>${options}</select><label>Thứ tự</label><input id="type-order" type="number" min="1" value="${Number(item.sortOrder||'')}"><label class="check-option"><input id="type-active" type="checkbox" ${item.active!==false?'checked':''}><span><strong>Đang sử dụng</strong></span></label></details><div class="form-actions"><button class="button primary" type="submit">Lưu loại hồ sơ</button></div></form>`);
    $('#type-name').insertAdjacentHTML('afterend', `<label>Document type (English)</label><input id="type-name-en" value="${escapeHtml(item.nameEn||'')}">`);
    $('#type-description').insertAdjacentHTML('afterend', `<label>Description (English)</label><textarea id="type-description-en">${escapeHtml(item.descriptionEn||'')}</textarea>`);
    $('#type-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('saveDocumentType',{typeId:item.typeId||'',name:$('#type-name').value,nameEn:$('#type-name-en').value,descriptionEn:$('#type-description-en').value,handoverMode:$('#type-handover-mode').value,description:$('#type-description').value,tracksProgress:$('#type-tracking').value==='YES',workflowVersionId:$('#type-workflow').value,sortOrder:Number($('#type-order').value)||undefined,active:$('#type-active').checked});closeModal();toast('Đã lưu loại hồ sơ.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }
  function editTypeById(typeId){showTypeForm(state.types.find(item=>item.typeId===typeId)||{});}

  function confirmDeleteType(typeId) {
    const item=state.types.find(type=>type.typeId===typeId);
    if(!item){toast('Không tìm thấy loại hồ sơ.',true);return;}
    openModal(`<h2>Xóa ${escapeHtml(item.name)}?</h2><div class="inline-warning">Chỉ xóa được loại chưa có hồ sơ hay yêu cầu nào. Nếu đã dùng, chọn “Ngừng sử dụng” để giữ lịch sử.</div><form id="delete-type-form"><div class="form-actions"><button id="cancel-delete-type" class="button" type="button">Hủy</button><button class="button danger" type="submit">Xóa loại hồ sơ</button></div></form>`);
    $('#cancel-delete-type').addEventListener('click',closeModal);
    $('#delete-type-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true,'Đang xóa…');try{await api('deleteDocumentType',typeId);closeModal();toast('Đã xóa loại hồ sơ.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  function showWorkflowForm() {
    openModal(`<h2>Tạo phiên bản quy trình</h2><p>Quy trình mới không ảnh hưởng hồ sơ đang xử lý.</p><form id="workflow-form"><label>Tên quy trình</label><input id="workflow-name" required><label>Các bước xử lý</label><div id="workflow-steps"></div><button id="add-workflow-step" type="button" class="button small">Thêm bước</button><div class="form-actions"><button class="button primary" type="submit">Tạo quy trình</button></div></form>`);
    $('#workflow-name').insertAdjacentHTML('afterend', '<label>Workflow name (English)</label><input id="workflow-name-en">');
    const add=()=>{$('#workflow-steps').insertAdjacentHTML('beforeend',`<div class="grid two-col compact workflow-step-input"><input placeholder="Tên bước" required><input placeholder="Nhãn trạng thái" required><input placeholder="Step name (English)"><input placeholder="Status label (English)"></div>`)}; add(); add();
    $('#add-workflow-step').addEventListener('click',add);
    $('#workflow-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{const steps=$$('.workflow-step-input').map(row=>({name:$('input:nth-child(1)',row).value,statusLabel:$('input:nth-child(2)',row).value,nameEn:$('input:nth-child(3)',row).value,statusLabelEn:$('input:nth-child(4)',row).value}));await api('saveWorkflow',{name:$('#workflow-name').value,nameEn:$('#workflow-name-en').value,steps});closeModal();toast('Đã tạo quy trình.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  function viewWorkflow(id) { const w=state.workflows.find(x=>x.workflowVersionId===id); if(!w)return; openModal(`<h2>${escapeHtml(w.name)}</h2><p>Phiên bản ${w.version}</p><div class="timeline">${w.steps.map(step=>`<div class="timeline-step done"><strong>${step.order}. ${escapeHtml(step.name)}</strong><small>${escapeHtml(step.statusLabel)}</small></div>`).join('')}</div>`); }

  async function loadService() {
    const [active,sessions]=await Promise.all([api('getActiveServiceSession'),api('listServiceSessions',{query:$('#service-search').value})]);
    renderServiceRecorder(active); renderServiceHistory(sessions);
  }

  function renderServiceRecorder(active) {
    clearInterval(state.serviceTimer);
    if(active){$('#service-recorder').innerHTML=`<div class="timer"><span>${escapeHtml(active.studentName)} - MSSV: ${escapeHtml(active.studentId)}</span><strong id="timer-value">00:00:00</strong><button class="button primary" onclick="window.app.finishService('${active.sessionId}')">Kết thúc buổi tiếp</button></div>`;const start=new Date(active.startedAt).getTime();const tick=()=>{const seconds=Math.max(0,Math.floor((Date.now()-start)/1000));$('#timer-value').textContent=[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(x=>String(x).padStart(2,'0')).join(':')};tick();state.serviceTimer=setInterval(tick,1000);}else{$('#service-recorder').innerHTML=`<form id="start-service-form"><label>Email hoặc MSSV sinh viên</label><input id="live-student" required><button class="button primary" type="submit">Bắt đầu tiếp sinh viên</button></form>`;$('#start-service-form').addEventListener('submit',async event=>{event.preventDefault();const value=$('#live-student').value.trim();const button=event.submitter;setBusy(button,true);try{const payload=value.includes('@')?{studentEmail:value}:{studentId:value};await api('startServiceSession',payload);await loadService();}catch(error){showAlert(error.message);}finally{setBusy(button,false);}});}
  }

  function finishService(sessionId) { openModal(`<h2>Kết thúc buổi tiếp sinh viên</h2><form id="finish-service-form"><label>Nội dung trao đổi</label><textarea id="finish-topic" required></textarea><label>Kết quả xử lý</label><textarea id="finish-result" required></textarea><label>Ghi chú</label><textarea id="finish-note"></textarea><div class="form-actions"><button class="button primary" type="submit">Lưu buổi tiếp</button></div></form>`);$('#finish-service-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('finishServiceSession',{sessionId,topic:$('#finish-topic').value,result:$('#finish-result').value,note:$('#finish-note').value});closeModal();toast('Đã lưu buổi tiếp sinh viên.');await loadService();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}}); }

  async function saveManualService(event) { event.preventDefault();const button=event.submitter;setBusy(button,true);try{const value=$('#manual-student').value.trim();const student=value.includes('@')?{studentEmail:value}:{studentId:value};await api('addManualServiceSession',{...student,startedAt:$('#manual-start').value,result:$('#manual-result').value,endedAt:$('#manual-end').value,topic:$('#manual-topic').value});event.target.reset();toast('Đã lưu buổi tiếp sinh viên.');await loadServiceHistory();}catch(error){showAlert(error.message);}finally{setBusy(button,false);} }
  async function loadServiceHistory(){const sessions=await api('listServiceSessions',{query:$('#service-search').value});renderServiceHistory(sessions);}
  function renderServiceHistory(sessions){$('#service-history').innerHTML=table(['Sinh viên','Thời gian','Thời lượng','Nội dung','Kết quả','Cán bộ'],sessions.map(row=>[`<strong>${escapeHtml(row.studentName)}</strong><small>MSSV: ${escapeHtml(row.studentId)} - Lớp: ${escapeHtml(row.className)}</small>`,fmtDate(row.startedAt),`${row.durationMinutes} phút`,escapeHtml(row.topic),escapeHtml(row.result),escapeHtml(row.staffEmail)]));}

  async function loadStudents(){const rows=await api('listStudents',$('#student-search').value);$('#students-table').innerHTML=table(['MSSV','Họ tên','Lớp','Email','Cập nhật'],rows.map(row=>[`<span class="code">${escapeHtml(row.studentId)}</span>`,escapeHtml(row.fullName),escapeHtml(row.className),escapeHtml(row.email),fmtDate(row.updatedAt)]));}

  async function loadReport(){const report=await api('getReport',{from:$('#report-from').value,to:$('#report-to').value});$('#report-kpis').innerHTML=kpis([['Yêu cầu đã gửi',report.requestCount,'kpi-prog'],['Còn chờ xác nhận',report.pendingRequestCount,'kpi-act'],['Giấy tờ đã nộp',report.submittedCount,'kpi-store'],['Giấy tờ đã nhận',report.receivedCount,'kpi-store'],['Giấy tờ xác nhận',report.approvedItemCount,'kpi-ok'],['Đang xử lý',report.processingDocuments,'kpi-prog'],['Cần bổ sung',report.supplementDocuments,'kpi-bad'],['Đã hoàn thành',report.completedDocuments,'kpi-ok']]);}
  async function exportReport(){try{const csv=await api('exportReportCsv',{from:$('#report-from').value,to:$('#report-to').value});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`bao-cao-ho-so-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);}catch(error){showAlert(error.message);}}

  async function loadSettings(){const settings=await api('getSettings');$('#setting-app-name').value=settings.APP_NAME||'';$('#setting-office-name').value=settings.OFFICE_NAME||'';}
  async function saveSettings(event){event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('saveSettings',{APP_NAME:$('#setting-app-name').value,OFFICE_NAME:$('#setting-office-name').value});toast('Đã lưu.');state.boot=await api('getBootstrap');renderShell();}catch(error){showAlert(error.message);}finally{setBusy(button,false);}}
  async function runHealthCheck(){const button=$('#health-check');setBusy(button,true);try{$('#health-result').textContent=JSON.stringify(await api('healthCheck'),null,2);}catch(error){$('#health-result').textContent=error.message;}finally{setBusy(button,false);}}

  function table(headers, rows){if(!rows.length)return '<div class="empty">Không có dữ liệu.</div>';return `<table class="data-table"><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}

  window.app = {openDocument, readNotification, reviewItem, approveTransaction, updatePendingSelection, selectAllPending, editDocument, editType:editTypeById, deleteType:confirmDeleteType, viewWorkflow, finishService};
  initialize();
})();
</script>
