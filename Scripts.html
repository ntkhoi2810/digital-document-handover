  async function openDocument(documentId) {
    try {
      const doc = await api('getDocumentDetail', documentId);
      const total = doc.steps.length || 1;
      const doneCount = doc.steps.filter(step => step.state === 'DONE').length;
      const currentIndex = doc.steps.findIndex(step => step.state === 'CURRENT');
      const stepNumber = currentIndex >= 0 ? currentIndex + 1 : Math.min(total, Math.max(1, doneCount));
      const timeline = doc.steps.length ? doc.steps.map(step => {
        const event = [...doc.events].reverse().find(evt => evt.toStepId === step.stepId);
        const attention = step.state === 'CURRENT' && doc.status === 'Yêu cầu bổ sung' ? ' attention' : '';
        return `<div class="timeline-step ${step.state.toLowerCase()}${attention}"><strong>${localizedHtml(step.name,step.nameEn)}</strong><small>${event ? dateHtml(event.createdAt) : (step.state==='CURRENT'?localizedHtml('Đang làm','In progress'):'')}</small>${event?.publicNote?`<div class="timeline-note" data-no-translate>${escapeHtml(event.publicNote)}</div>`:''}</div>`;
      }).join('') : doc.events.map(evt => `<div class="timeline-step done"><strong>${statusHtml(evt.status,evt.statusEn)}</strong><small>${dateHtml(evt.createdAt)}</small>${evt.publicNote?`<div class="timeline-note" data-no-translate>${escapeHtml(evt.publicNote)}</div>`:''}</div>`).join('');
      const documentName=typeNamePair(doc.typeId,doc.typeName,doc.typeNameEn);
      openModal(`<h2 class="detail-title">${localizedHtml(documentName.vi,documentName.en)}</h2><div class="detail-meta"><code>${escapeHtml(doc.code)}</code><span class="status ${statusClass(doc.status)}">${statusHtml(doc.status,doc.statusEn)}</span></div><div class="detail-facts"><div><small>Ghi nhận</small><strong>${dateHtml(doc.submittedAt,true)}</strong></div><div><small>Dự kiến xong</small><strong>${dateHtml(doc.expectedAt,true)}</strong></div></div><div class="detail-section-head"><span>Tiến độ</span><span>${localizedHtml(`Bước ${stepNumber}/${total}`,`Step ${stepNumber} of ${total}`)}</span></div><div class="timeline">${timeline}</div><p class="detail-updated">${localizedHtml('Cập nhật','Updated')} ${dateHtml(doc.updatedAt)}</p>`);
    } catch (error) { showAlert(error.message); }
  }

  async function approveTransaction(transactionId, button) {
    const selected = $$(`.pending-item-select[data-transaction-id="${transactionId}"]:checked`);
    if (!selected.length) { toast('Chọn ít nhất một giấy tờ.', true); return; }
    const itemIds = selected.map(input => input.value);
    const documentSelections = {};
    for (const itemId of itemIds) {
      const select = $(`.pickup-document-select[data-item-id="${itemId}"]`);
      if (select) {
        if (!select.value) { toast('Chọn hồ sơ cụ thể cho mục có nhiều hồ sơ.', true); return; }
        documentSelections[itemId] = select.value;
      }
    }
    setBusy(button,true,'Đang xác nhận…');
    try {
      await api('reviewTransactionItems',{itemIds,decision:'APPROVE',note:$(`#review-note-${transactionId}`).value,messageBody:$(`#review-${transactionId}-body`).value,sendEmail:$(`#review-email-${transactionId}`).checked,documentSelections});
      toast(`Đã xác nhận ${itemIds.length} giấy tờ.`); await loadPending();
    } catch(error) { toast(error.message,true); }
    finally { setBusy(button,false); }
  }

    const title = decision === 'APPROVE' ? 'Xác nhận giấy tờ' : 'Từ chối giấy tờ';
    openModal(`<h2>${title}</h2><p>${decision==='APPROVE'?'Xác nhận sau khi đã đối chiếu sinh viên và giấy tờ thực tế tại quầy.':'Ghi lý do để sinh viên biết cần làm gì.'}</p><form id="review-form"><label>Ghi chú xử lý</label><textarea id="review-note" rows="4" ${decision==='REJECT'?'required':''}></textarea>${messageBodyField('review')}<label class="check-option"><input id="review-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button ${decision==='APPROVE'?'primary':'danger'}" type="submit">${title}</button></div></form>`);
    $('#review-form').addEventListener('submit', async event => {

    $('#batch-document-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('batchUpdateDocuments',{documentIds:ids,status:$('#batch-status').value,publicNote:$('#batch-note').value,messageBody:$('#batch-body').value,sendEmail:$('#batch-email').checked});closeModal();toast('Đã cập nhật các hồ sơ đã chọn.');await loadAdminDocuments();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  async function editDocument(documentId) {
    try {
      const doc = await api('getDocumentDetail',documentId);
      const steps=(doc.steps||[]).map(step=>localizedOption(step.order+'. '+step.name,step.order+'. '+(step.nameEn||step.name),step.stepId)).join('');
      const statusValues=[...new Set(['Đã tiếp nhận','Đang kiểm tra hồ sơ','Yêu cầu bổ sung','Đang xử lý','Đang trình duyệt','Chờ phê duyệt','Đã hoàn thành','Chờ sinh viên đến nhận','Đã bàn giao',...(doc.steps||[]).map(step=>step.statusLabel),doc.status].filter(Boolean))];
      const statuses=statusValues.map(value=>{const step=(doc.steps||[]).find(item=>item.statusLabel===value);return localizedOption(value,step?.statusLabelEn||translations[value]||value,value,value===doc.status);}).join('');
      const docTypeName=typeNamePair(doc.typeId,doc.typeName);
      openModal(`<h2>Cập nhật ${escapeHtml(doc.code)}</h2><p>${localizedHtml(docTypeName.vi,docTypeName.en)}</p><form id="document-update-form"><label>Bước xử lý</label><select id="doc-step"><option value="">Giữ nguyên bước hiện tại</option>${steps}</select><label>Trạng thái</label><select id="doc-status">${statuses}</select><small>Bước xử lý được chọn tự điền trạng thái. Bạn có thể sửa trạng thái riêng.</small><label>Ngày hoàn thành dự kiến</label><input id="doc-expected" type="date" value="${doc.expectedAt?doc.expectedAt.slice(0,10):''}"><label>Phản hồi công khai</label><textarea id="doc-public-note" rows="3">${escapeHtml(doc.publicNote||'')}</textarea><label>Ghi chú nội bộ</label><textarea id="doc-internal-note" rows="3">${escapeHtml(doc.internalNote||'')}</textarea>${messageBodyField('doc')}<label class="check-option"><input id="doc-send-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button primary" type="submit">Lưu cập nhật</button></div></form>`);
      let overrideStepStatus=false;
      $('#doc-step').addEventListener('change',event=>{const statusSelect=$('#doc-status');const step=(doc.steps||[]).find(item=>item.stepId===event.target.value);if(!step){statusSelect.value=doc.status;overrideStepStatus=false;return;}if(!Array.from(statusSelect.options).some(option=>option.value===step.statusLabel)){statusSelect.insertAdjacentHTML('beforeend',localizedOption(step.statusLabel,step.statusLabelEn||step.statusLabel,step.statusLabel));}statusSelect.value=step.statusLabel;overrideStepStatus=false;});
      $('#doc-status').addEventListener('change',()=>{overrideStepStatus=true;});
      $('#document-update-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('updateDocumentProgress',{documentId,version:doc.version,stepId:$('#doc-step').value,status:$('#doc-status').value,overrideStepStatus,expectedAt:$('#doc-expected').value,publicNote:$('#doc-public-note').value,internalNote:$('#doc-internal-note').value,messageBody:$('#doc-body').value,sendEmail:$('#doc-send-email').checked});closeModal();toast('Đã cập nhật tiến độ hồ sơ.');await loadAdminDocuments();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
    } catch(error){showAlert(error.message);}
  }

  async function loadCatalog() {
    const [types,workflows]=await Promise.all([api('listDocumentTypes',true),api('listWorkflows')]);
    state.workflows=workflows; state.types=types; state.boot.types=types.filter(x=>x.active);
    const handoverLabel={SUBMIT:['Nộp','Submit'],RECEIVE:['Nhận','Collect'],BOTH:['Nộp và nhận','Submit and collect']};
    const handoverClass={SUBMIT:'submit',RECEIVE:'receive',BOTH:'both'};
    $('#document-types-admin').innerHTML=types.map(item=>`<div class="list-item${item.active?'':' inactive-item'}"><div><strong>${localizedHtml(item.name,item.nameEn)}</strong><small><span class="meta-tag ${handoverClass[item.handoverMode]||'both'}">${localizedHtml(...(handoverLabel[item.handoverMode]||handoverLabel.BOTH))}</span><span class="meta-tag ${item.tracksProgress?'track':'record'}">${item.tracksProgress?localizedHtml('Theo dõi tiến độ','Track progress'):localizedHtml('Chỉ ghi nhận','Record only')}</span><span class="status ${item.active?'ok':'bad'}">${localizedHtml(item.active?'Đang sử dụng':'Ngừng sử dụng',item.active?'Active':'Inactive')}</span></small></div><div class="review-actions"><button class="link-button" onclick="window.app.editType('${escapeHtml(item.typeId)}')">Sửa</button><button class="link-button danger" onclick="window.app.deleteType('${escapeHtml(item.typeId)}')">Xóa</button></div></div>`).join('')||'<div class="empty">Chưa có loại hồ sơ.</div>';
    $('#workflows-admin').innerHTML=workflows.map(w=>`<div class="list-item${w.active?'':' inactive-item'}"><div><strong>${localizedHtml(w.name,w.nameEn)}</strong><small><span class="meta-tag record">${localizedHtml(`Phiên bản ${w.version} - ${w.steps.length} bước`,`Version ${w.version} - ${w.steps.length} steps`)}</span><span class="status ${w.active?'ok':'bad'}">${localizedHtml(w.active?'Đang sử dụng':'Ngừng sử dụng',w.active?'Active':'Inactive')}</span></small></div><button class="link-button" onclick="window.app.viewWorkflow('${w.workflowVersionId}')">Xem</button></div>`).join('')||'<div class="empty">Chưa có quy trình.</div>';
  }

  function showTypeForm(item={}) {
    const options=state.workflows.map(w=>localizedOption(`${w.name} - v${w.version}`,`${w.nameEn || w.name} - v${w.version}`,w.workflowVersionId,w.workflowVersionId===item.workflowVersionId)).join('');
    const mode=item.handoverMode||'SUBMIT';
    openModal(`<h2>${item.typeId?'Chỉnh sửa':'Thêm'} loại hồ sơ</h2><form id="type-form"><label>Tên loại hồ sơ</label><input id="type-name" value="${escapeHtml(item.name||'')}" required><label>Hình thức</label><select id="type-handover-mode"><option value="SUBMIT" ${mode==='SUBMIT'?'selected':''}>Sinh viên nộp</option><option value="RECEIVE" ${mode==='RECEIVE'?'selected':''}>Sinh viên nhận</option><option value="BOTH" ${mode==='BOTH'?'selected':''}>Cả nộp và nhận</option></select><label>Kiểu theo dõi</label><select id="type-tracking"><option value="NO" ${!item.tracksProgress?'selected':''}>Chỉ ghi nhận giao nhận</option><option value="YES" ${item.tracksProgress?'selected':''}>Có tiến độ xử lý</option></select><details class="advanced-options"><summary>Tùy chọn nâng cao</summary><label>Mô tả</label><textarea id="type-description">${escapeHtml(item.description||'')}</textarea><label>Quy trình</label><select id="type-workflow"><option value="">Dùng quy trình chuẩn</option>${options}</select><label>Thứ tự</label><input id="type-order" type="number" min="1" value="${Number(item.sortOrder||'')}"><label class="check-option"><input id="type-active" type="checkbox" ${item.active!==false?'checked':''}><span><strong>Đang sử dụng</strong></span></label></details><div class="form-actions"><button class="button primary" type="submit">Lưu loại hồ sơ</button></div></form>`);
    $('#type-name').insertAdjacentHTML('afterend', `<label>Tên loại hồ sơ (tiếng Anh)</label><input id="type-name-en" value="${escapeHtml(item.nameEn||'')}">`);
    $('#type-description').insertAdjacentHTML('afterend', `<label>Mô tả (tiếng Anh)</label><textarea id="type-description-en">${escapeHtml(item.descriptionEn||'')}</textarea>`);
    $('#type-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('saveDocumentType',{typeId:item.typeId||'',name:$('#type-name').value,nameEn:$('#type-name-en').value,descriptionEn:$('#type-description-en').value,handoverMode:$('#type-handover-mode').value,description:$('#type-description').value,tracksProgress:$('#type-tracking').value==='YES',workflowVersionId:$('#type-workflow').value,sortOrder:Number($('#type-order').value)||undefined,active:$('#type-active').checked});closeModal();toast('Đã lưu loại hồ sơ.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }
  function editTypeById(typeId){showTypeForm(state.types.find(item=>item.typeId===typeId)||{});}

  function confirmDeleteType(typeId) {
    const item=state.types.find(type=>type.typeId===typeId);
    if(!item){toast('Không tìm thấy loại hồ sơ.',true);return;}
    openModal(`<h2>${localizedHtml('Xóa','Delete')} ${localizedHtml(item.name,item.nameEn)}?</h2><div class="inline-warning">Chỉ xóa được loại chưa có hồ sơ hay yêu cầu nào. Nếu đã dùng, chọn “Ngừng sử dụng” để giữ lịch sử.</div><form id="delete-type-form"><div class="form-actions"><button id="cancel-delete-type" class="button" type="button">Hủy</button><button class="button danger" type="submit">Xóa loại hồ sơ</button></div></form>`);
    $('#cancel-delete-type').addEventListener('click',closeModal);
    $('#delete-type-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true,'Đang xóa…');try{await api('deleteDocumentType',typeId);closeModal();toast('Đã xóa loại hồ sơ.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  function showWorkflowForm() {
    openModal(`<h2>Tạo phiên bản quy trình</h2><p>Quy trình mới không ảnh hưởng hồ sơ đang xử lý.</p><form id="workflow-form"><label>Tên quy trình</label><input id="workflow-name" required><label>Các bước xử lý</label><div id="workflow-steps"></div><button id="add-workflow-step" type="button" class="button small">Thêm bước</button><div class="form-actions"><button class="button primary" type="submit">Tạo quy trình</button></div></form>`);
    $('#workflow-name').insertAdjacentHTML('afterend', '<label>Tên quy trình (tiếng Anh)</label><input id="workflow-name-en">');
    const add=()=>{$('#workflow-steps').insertAdjacentHTML('beforeend',`<div class="grid two-col compact workflow-step-input"><input placeholder="Tên bước" required><input placeholder="Nhãn trạng thái" required><input placeholder="Tên bước (tiếng Anh)"><input placeholder="Nhãn trạng thái (tiếng Anh)"></div>`)}; add(); add();
    $('#add-workflow-step').addEventListener('click',add);
    $('#workflow-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{const steps=$$('.workflow-step-input').map(row=>({name:$('input:nth-child(1)',row).value,statusLabel:$('input:nth-child(2)',row).value,nameEn:$('input:nth-child(3)',row).value,statusLabelEn:$('input:nth-child(4)',row).value}));await api('saveWorkflow',{name:$('#workflow-name').value,nameEn:$('#workflow-name-en').value,steps});closeModal();toast('Đã tạo quy trình.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  function viewWorkflow(id) { const w=state.workflows.find(x=>x.workflowVersionId===id); if(!w)return; openModal(`<h2>${localizedHtml(w.name,w.nameEn)}</h2><p>${localizedHtml(`Phiên bản ${w.version}`,`Version ${w.version}`)}</p><div class="timeline">${w.steps.map(step=>`<div class="timeline-step done"><strong>${step.order}. ${localizedHtml(step.name,step.nameEn)}</strong><small>${localizedHtml(step.statusLabel,step.statusLabelEn)}</small></div>`).join('')}</div>`); }

  async function loadService() {
    const [active,sessions]=await Promise.all([api('getActiveServiceSession'),api('listServiceSessions',{query:$('#service-search').value})]);
    renderServiceRecorder(active); renderServiceHistory(sessions);
  }

  function renderServiceRecorder(active) {
    clearInterval(state.serviceTimer);
    if(active){$('#service-recorder').innerHTML=`<div class="timer"><span><span data-no-translate>${escapeHtml(active.studentName)}</span> - MSSV: ${escapeHtml(active.studentId)}</span><strong id="timer-value">00:00:00</strong><button class="button primary" onclick="window.app.finishService('${active.sessionId}')">Kết thúc buổi tiếp</button></div>`;const start=new Date(active.startedAt).getTime();const tick=()=>{const seconds=Math.max(0,Math.floor((Date.now()-start)/1000));$('#timer-value').textContent=[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(x=>String(x).padStart(2,'0')).join(':')};tick();state.serviceTimer=setInterval(tick,1000);}else{$('#service-recorder').innerHTML=`<form id="start-service-form"><label>Email hoặc MSSV sinh viên</label><input id="live-student" required><button class="button primary" type="submit">Bắt đầu tiếp sinh viên</button></form>`;$('#start-service-form').addEventListener('submit',async event=>{event.preventDefault();const value=$('#live-student').value.trim();const button=event.submitter;setBusy(button,true);try{const payload=value.includes('@')?{studentEmail:value}:{studentId:value};await api('startServiceSession',payload);await loadService();}catch(error){showAlert(error.message);}finally{setBusy(button,false);}});}
  }

  function finishService(sessionId) { openModal(`<h2>Kết thúc buổi tiếp sinh viên</h2><form id="finish-service-form"><label>Nội dung trao đổi</label><textarea id="finish-topic" required></textarea><label>Kết quả xử lý</label><textarea id="finish-result" required></textarea><label>Ghi chú</label><textarea id="finish-note"></textarea>${messageFields('finish-service')}<label class="check-option"><input id="finish-service-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button primary" type="submit">Lưu buổi tiếp</button></div></form>`);$('#finish-service-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('finishServiceSession',{sessionId,topic:$('#finish-topic').value,result:$('#finish-result').value,note:$('#finish-note').value,messageTitle:$('#finish-service-title').value,messageBody:$('#finish-service-body').value,sendEmail:$('#finish-service-email').checked});closeModal();toast('Đã lưu buổi tiếp sinh viên.');await loadService();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}}); }

  async function saveManualService(event) { event.preventDefault();const button=event.submitter;setBusy(button,true);try{const value=$('#manual-student').value.trim();const student=value.includes('@')?{studentEmail:value}:{studentId:value};await api('addManualServiceSession',{...student,startedAt:$('#manual-start').value,result:$('#manual-result').value,endedAt:$('#manual-end').value,topic:$('#manual-topic').value,messageTitle:$('#manual-service-title').value,messageBody:$('#manual-service-body').value,sendEmail:$('#manual-service-email').checked});event.target.reset();toast('Đã lưu buổi tiếp sinh viên.');await loadServiceHistory();}catch(error){showAlert(error.message);}finally{setBusy(button,false);} }
  async function loadServiceHistory(){const sessions=await api('listServiceSessions',{query:$('#service-search').value});renderServiceHistory(sessions);}
  function renderServiceHistory(sessions){$('#service-history').innerHTML=table(['Sinh viên','Thời gian','Thời lượng','Nội dung','Kết quả','Cán bộ'],sessions.map(row=>[`<strong data-no-translate>${escapeHtml(row.studentName)}</strong><small>${localizedHtml(`MSSV: ${row.studentId} - Lớp: ${row.className}`,`Student ID: ${row.studentId} - Class: ${row.className}`)}</small>`,dateHtml(row.startedAt),localizedHtml(`${row.durationMinutes} phút`,`${row.durationMinutes} minutes`),`<span data-no-translate>${escapeHtml(row.topic)}</span>`,`<span data-no-translate>${escapeHtml(row.result)}</span>`,escapeHtml(row.staffEmail)]));}

  async function loadStudents(){const rows=await api('listStudents',$('#student-search').value);$('#students-table').innerHTML=table(['MSSV','Họ tên','Lớp','Email','Cập nhật'],rows.map(row=>[`<span class="code">${escapeHtml(row.studentId)}</span>`,`<span data-no-translate>${escapeHtml(row.fullName)}</span>`,`<span data-no-translate>${escapeHtml(row.className)}</span>`,escapeHtml(row.email),dateHtml(row.updatedAt)]));}

  async function loadReport(){const report=await api('getReport',{from:$('#report-from').value,to:$('#report-to').value});$('#report-kpis').innerHTML=kpis([['Yêu cầu đã gửi',report.requestCount,'kpi-prog'],['Còn chờ xác nhận',report.pendingRequestCount,'kpi-act'],['Giấy tờ đã nộp',report.submittedCount,'kpi-store'],['Giấy tờ đã nhận',report.receivedCount,'kpi-store'],['Giấy tờ xác nhận',report.approvedItemCount,'kpi-ok'],['Đang xử lý',report.processingDocuments,'kpi-prog'],['Cần bổ sung',report.supplementDocuments,'kpi-bad'],['Đã hoàn thành',report.completedDocuments,'kpi-ok']]);}
  async function exportReport(){try{const csv=await api('exportReportCsv',{from:$('#report-from').value,to:$('#report-to').value});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`bao-cao-ho-so-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);}catch(error){showAlert(error.message);}}

  async function loadSettings(){const settings=await api('getSettings');$('#setting-app-name').value=settings.APP_NAME||'';$('#setting-office-name').value=settings.OFFICE_NAME||'';}
  async function saveSettings(event){event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('saveSettings',{APP_NAME:$('#setting-app-name').value,OFFICE_NAME:$('#setting-office-name').value});toast('Đã lưu.');state.boot=await api('getBootstrap');renderShell();}catch(error){showAlert(error.message);}finally{setBusy(button,false);}}
  async function runHealthCheck(){const button=$('#health-check');setBusy(button,true);try{$('#health-result').textContent=JSON.stringify(await api('healthCheck'),null,2);}catch(error){$('#health-result').textContent=error.message;}finally{setBusy(button,false);}}

  function table(headers, rows){if(!rows.length)return '<div class="empty">Không có dữ liệu.</div>';return `<table class="data-table"><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}

  window.app = {openDocument, readNotification, reviewItem, approveTransaction, updatePendingSelection, selectAllPending, editDocument, editType:editTypeById, deleteType:confirmDeleteType, viewWorkflow, finishService};
  initialize();
})();
</script>
