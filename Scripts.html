<script>
(() => {
  'use strict';
  const state = { boot: null, documents: [], transactions: [], notifications: [], pending: [], adminDocuments: [], workflows: [], types: [], serviceTimer: null, toastTimer: null };
  const $ = (selector, root = document) => root.querySelector(selector);
  const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const fmtDate = value => value ? new Intl.DateTimeFormat('vi-VN', {dateStyle:'short', timeStyle:'short', timeZone:'Asia/Ho_Chi_Minh'}).format(new Date(value)) : '—';
  const fmtDay = value => value ? new Intl.DateTimeFormat('vi-VN', {dateStyle:'short', timeZone:'Asia/Ho_Chi_Minh'}).format(new Date(value)) : '—';
  const typeLabel = value => ({SUBMIT:'Nộp hồ sơ', RECEIVE:'Nhận hồ sơ', SUPPLEMENT:'Bổ sung giấy tờ'})[value] || value;
  const statusLabel = value => ({PENDING:'Chờ xác nhận', PARTIAL:'Đã xác nhận một phần', COMPLETED:'Hoàn tất', REJECTED:'Bị từ chối', APPROVED:'Đã xác nhận'})[value] || value;
  const statusClass = value =>
    /APPROVED|COMPLETED|Đã hoàn thành|Đã bàn giao/.test(value) ? 'ok' :
    /REJECTED|Đã hủy/.test(value) ? 'bad' :
    /PENDING|PARTIAL|Yêu cầu bổ sung|Chờ sinh viên đến nhận/.test(value) ? 'act' :
    /Đang|Chờ phê duyệt/.test(value) ? 'prog' : '';

  function api(name, ...args) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(error => reject(normalizeError(error)))
        [name](...args);
    });
  }

  function normalizeError(error) {
    const raw = String(error && error.message ? error.message : error || 'Có lỗi xảy ra.');
    const clean = raw.replace(/^Exception:\s*/i, '');
    const parts = clean.split('|');
    const err = new Error(parts.length > 1 ? parts.slice(1).join('|') : clean);
    err.code = parts.length > 1 ? parts[0] : 'ERROR';
    return err;
  }

  function setBusy(button, busy, label = 'Đang xử lý…') {
    if (!button) return;
    if (busy) { button.dataset.original = button.textContent; button.textContent = label; button.disabled = true; }
    else { button.textContent = button.dataset.original || button.textContent; button.disabled = false; }
  }

  function toast(message, error = false) {
    const el = $('#toast'); el.textContent = message; el.className = 'toast' + (error ? ' error' : '');
    clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(() => el.classList.add('hidden'), 3500);
  }

  function showAlert(message, success = false) {
    const el = $('#alert'); el.textContent = message; el.className = 'alert' + (success ? ' success' : '');
    window.scrollTo({top:0, behavior:'smooth'});
  }
  function hideAlert() { $('#alert').classList.add('hidden'); }

  function openModal(html) { $('#modal-content').innerHTML = html; $('#modal').classList.remove('hidden'); }
  function closeModal() { $('#modal').classList.add('hidden'); $('#modal-content').innerHTML = ''; }

  async function initialize() {
    bindGlobalEvents();
    try {
      state.boot = await api('getBootstrap');
      renderShell();
      $('#loading').classList.add('hidden');
      $('#app').classList.remove('hidden');
      const initial = window.INITIAL_VIEW === 'transaction' && state.boot.identity.role === 'STUDENT' ? 'student-transaction' : (state.boot.identity.role === 'ADMIN' ? 'admin-home' : 'student-home');
      await navigate(initial);
    } catch (error) {
      $('#loading').innerHTML = `<div class="access-error"><h2>Không vào được</h2><p>${escapeHtml(error.message)}</p><p>Đăng nhập bằng tài khoản TDTU rồi tải lại trang.</p><button class="button primary" onclick="location.reload()">Tải lại</button></div>`;
    }
  }

  function renderShell() {
    const {identity, profile, appName, officeName, dashboard} = state.boot;
    $('#app').dataset.role = identity.role;
    $('#brand-title').textContent = appName;
    $('#office-name').textContent = officeName;
    $('#user-email').textContent = identity.email;
    const name = identity.role === 'ADMIN' ? (identity.name || identity.email.split('@')[0]) : (profile?.fullName || 'Sinh viên TDTU');
    $('#user-name').textContent = name;
    $('#student-nav').classList.toggle('hidden', identity.role !== 'STUDENT');
    $('#admin-nav').classList.toggle('hidden', identity.role !== 'ADMIN');
    if (identity.role === 'STUDENT') {
      renderStudentKpis(dashboard); renderProfile();
      $('#notice-badge').textContent = dashboard.unreadNotifications || 0;
      $('#notice-badge').classList.toggle('hidden', !dashboard.unreadNotifications);
      $('#profile-required').classList.toggle('hidden', Boolean(profile));
    } else {
      renderAdminKpis(dashboard); renderQr();
    }
  }

  function bindGlobalEvents() {
    document.addEventListener('click', event => {
      const nav = event.target.closest('[data-view]'); if (nav) navigate(nav.dataset.view);
      const go = event.target.closest('[data-go]'); if (go) navigate(go.dataset.go);
    });
    $('#mobile-menu').addEventListener('click', () => $('.sidebar').classList.toggle('open'));
    document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCurrent(); });
    $('#modal-close').addEventListener('click', closeModal);
    $('#modal').addEventListener('click', event => { if (event.target === $('#modal')) closeModal(); });
    $('#profile-form').addEventListener('submit', saveProfile);
    $('#transaction-form').addEventListener('submit', submitTransaction);
    $$('input[name="transactionType"]').forEach(input => input.addEventListener('change', () => renderTransactionOptions().catch(error => showAlert(error.message))));
    $('#my-document-search').addEventListener('input', renderMyDocuments);
    $('#transaction-options').addEventListener('change', updateTransactionSelection);
    $('#search-admin-documents').addEventListener('click', loadAdminDocuments);
    $('#admin-document-search').addEventListener('keydown', e => { if (e.key === 'Enter') loadAdminDocuments(); });
    $('#new-manual-document').addEventListener('click', showManualDocumentForm);
    $('#batch-documents').addEventListener('click', showBatchDocumentForm);
    $('#clear-document-selection').addEventListener('click', () => { $$('.document-select').forEach(input => { input.checked = false; }); updateDocumentBulkActions(); });
    $('#admin-documents-table').addEventListener('change', event => { if (event.target.matches('.document-select')) updateDocumentBulkActions(); });
    $('#new-type').addEventListener('click', () => showTypeForm());
    $('#new-workflow').addEventListener('click', showWorkflowForm);
    $('#manual-service-form').addEventListener('submit', saveManualService);
    $('#service-search').addEventListener('input', loadServiceHistory);
    $('#search-students').addEventListener('click', loadStudents);
    $('#run-report').addEventListener('click', loadReport);
    $('#export-report').addEventListener('click', exportReport);
    $('#settings-form').addEventListener('submit', saveSettings);
    $('#health-check').addEventListener('click', runHealthCheck);
    $('#print-qr').addEventListener('click', () => window.print());
    $('#pending-search').addEventListener('input', renderPendingTransactions);
  }

  const viewMeta = {
    'student-home':['Trang chủ',''], 'student-transaction':['Tạo yêu cầu',''],
    'student-documents':['Hồ sơ của tôi',''], 'student-history':['Lịch sử yêu cầu',''],
    'student-notifications':['Thông báo',''], 'student-profile':['Tài khoản','MSSV lấy từ email trường, không sửa được.'],
    'admin-home':['Tổng quan',''], 'admin-pending':['Chờ xác nhận','Chỉ xác nhận khi đã đối chiếu sinh viên và giấy tờ thực tế.'],
    'admin-documents':['Hồ sơ',''], 'admin-catalog':['Danh mục',''],
    'admin-service':['Tiếp sinh viên',''], 'admin-students':['Sinh viên',''],
    'admin-reports':['Báo cáo',''], 'admin-settings':['Cài đặt','']
  };

  async function navigate(view) {
    if (!document.getElementById(view)) return;
    $$('.view').forEach(el => el.classList.toggle('active-view', el.id === view));
    $$('.nav-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
    $('.sidebar').classList.remove('open');
    $('#page-title').textContent = viewMeta[view]?.[0] || '';
    $('#page-subtitle').textContent = viewMeta[view]?.[1] || '';
    hideAlert();
    try { await loadView(view); } catch (error) { showAlert(error.message); }
  }

  async function loadView(view) {
    const map = {
      'student-home': loadStudentHome, 'student-transaction': renderTransactionOptions, 'student-documents': loadMyDocuments,
      'student-history': loadMyTransactions, 'student-notifications': loadNotifications,
      'admin-home': loadAdminHome, 'admin-pending': loadPending, 'admin-documents': loadAdminDocuments,
      'admin-catalog': loadCatalog, 'admin-service': loadService, 'admin-students': loadStudents,
      'admin-reports': loadReport, 'admin-settings': loadSettings
    };
    if (map[view]) await map[view]();
  }

  async function refreshCurrent() { const current = $('.view.active-view'); if (current) await loadView(current.id); }

  function renderStudentKpis(data) {
    $('#student-kpis').innerHTML = kpis([
      ['Đang xử lý', data.processing], ['Cần bổ sung', data.supplement], ['Đã hoàn thành', data.completed], ['Chờ đến nhận', data.waitingPickup]
    ]);
  }
  function renderAdminKpis(data) {
    $('#admin-kpis').innerHTML = kpis([
      ['Chờ xác nhận', data.pendingTransactions], ['Đang lưu giữ', data.storedDocuments], ['Đang xử lý', data.processing], ['Cần bổ sung', data.supplement]
    ]);
  }
  const kpis = items => items.map(item => `<div class="kpi"><strong>${Number(item[1] || 0).toLocaleString('vi-VN')}</strong><span>${escapeHtml(item[0])}</span></div>`).join('');

  function renderProfile() {
    const {identity, profile} = state.boot;
    $('#profile-email').value = identity.email;
    $('#profile-student-id').value = identity.studentId || 'Chưa xác định';
    $('#profile-full-name').value = profile?.fullName || '';
    $('#profile-class').value = profile?.className || '';
  }

  async function saveProfile(event) {
    event.preventDefault(); const button = event.submitter; setBusy(button, true);
    try {
      state.boot.profile = await api('saveStudentProfile', {fullName:$('#profile-full-name').value, className:$('#profile-class').value});
      $('#user-name').textContent = state.boot.profile.fullName; $('#profile-required').classList.add('hidden');
      toast('Đã lưu.');
    } catch (error) { showAlert(error.message); } finally { setBusy(button, false); }
  }

  async function loadStudentHome() {
    const [dashboard, documents] = await Promise.all([api('getMyDashboard'), api('getMyDocuments')]);
    state.boot.dashboard = dashboard; state.documents = documents; renderStudentKpis(dashboard);
    const fullName = state.boot.profile?.fullName?.trim() || '';
    const firstName = fullName ? fullName.split(/\s+/).at(-1) : 'bạn';
    $('#page-title').textContent = `Chào ${firstName}`;
    $('#student-home-note').innerHTML = dashboard.supplement > 0 ? `Bạn có ${Number(dashboard.supplement).toLocaleString('vi-VN')} hồ sơ cần bổ sung. <button class="link-button" data-go="student-documents">Xem hồ sơ</button>` : '';
    $('#recent-documents').innerHTML = documents.slice(0,5).map(doc => `<button class="list-item" onclick="window.app.openDocument('${doc.documentId}')"><div><strong>${escapeHtml(doc.typeName)}</strong><small><span class="list-code">${escapeHtml(doc.code)}</span> · ${fmtDate(doc.updatedAt)}</small></div><span class="status ${statusClass(doc.status)}">${escapeHtml(doc.status)}</span></button>`).join('') || '<div class="empty">Chưa có hồ sơ.</div>';
  }

  async function renderTransactionOptions() {
    if (!state.boot || state.boot.identity.role !== 'STUDENT') return;
    state.documents = await api('getMyDocuments');
    const type = $('input[name="transactionType"]:checked')?.value || 'SUBMIT';
    let options = [];
    if (type === 'SUBMIT') options = state.boot.types.filter(item => ['SUBMIT','BOTH'].includes(item.handoverMode)).map(item => ({id:item.typeId, name:item.name, description:item.description, field:'typeId'}));
    else if (type === 'RECEIVE') options = state.boot.types.filter(item => ['RECEIVE','BOTH'].includes(item.handoverMode)).map(item => ({id:item.typeId, name:item.name, description:item.description, field:'typeId'}));
    else options = state.documents.filter(doc => !['Đã bàn giao','Đã hủy'].includes(doc.status)).map(doc => ({id:doc.documentId, name:doc.typeName, description:`${doc.code} · ${doc.status}`, field:'documentId'}));
    $('#transaction-options').innerHTML = options.map(item => `<label class="check-option"><input type="checkbox" value="${escapeHtml(item.id)}" data-field="${item.field}"><span><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(item.description || '')}</small></span></label>`).join('') || '<div class="empty">Chưa có giấy tờ nào để chọn.</div>';
    updateTransactionSelection();
  }

  function updateTransactionSelection() {
    const count = $$('#transaction-options input:checked').length;
    $('#transaction-selection').textContent = count ? `Đã chọn ${count} giấy tờ.` : 'Chọn ít nhất một giấy tờ.';
    $('#transaction-submit').textContent = `Gửi yêu cầu · ${count}`;
    $('#transaction-submit').disabled = count === 0;
  }

  async function submitTransaction(event) {
    event.preventDefault();
    if (!state.boot.profile) { await navigate('student-profile'); return; }
    const button = event.submitter; setBusy(button, true);
    try {
      const transactionType = $('input[name="transactionType"]:checked').value;
      const items = $$('#transaction-options input:checked').map(input => ({[input.dataset.field]:input.value}));
      const result = await api('createTransaction', {transactionType, items, note:$('#transaction-note').value, requestToken:'req_' + crypto.randomUUID().replaceAll('-','')});
      $('#transaction-form').reset(); $('#transaction-note').value='';
      toast(`Đã gửi yêu cầu ${result.code}. Cán bộ sẽ xác nhận khi bạn đến quầy.`); await navigate('student-history');
    } catch (error) { showAlert(error.message); } finally { setBusy(button, false); }
  }

  async function loadMyDocuments() { state.documents = await api('getMyDocuments'); renderMyDocuments(); }
  function renderMyDocuments() {
    const query = ($('#my-document-search').value || '').toLowerCase();
    const docs = state.documents.filter(doc => !query || `${doc.code} ${doc.typeName} ${doc.status}`.toLowerCase().includes(query));
    $('#my-documents').innerHTML = docs.map(doc => documentCard(doc)).join('') || '<div class="empty">Không có hồ sơ nào khớp.</div>';
  }
  function documentCard(doc) {
    return `<button type="button" class="document-card" onclick="window.app.openDocument('${doc.documentId}')"><div class="document-head"><div><h3>${escapeHtml(doc.typeName)}</h3><div class="document-meta"><span>${escapeHtml(doc.code)}</span><span>Ghi nhận ${fmtDay(doc.submittedAt)}</span><span>Cập nhật ${fmtDate(doc.updatedAt)}</span></div></div><span class="status ${statusClass(doc.status)}">${escapeHtml(doc.status)}</span></div>${doc.publicNote?`<p>${escapeHtml(doc.publicNote)}</p>`:''}</button>`;
  }

  async function loadMyTransactions() {
    state.transactions = await api('listMyTransactions');
    $('#my-transactions').innerHTML = state.transactions.map(transactionCard).join('') || '<div class="empty">Chưa có yêu cầu nào.</div>';
  }

  function transactionCard(tx, admin = false) {
    const items = tx.items.map(item => `<div class="transaction-item"><div><strong>${escapeHtml(item.typeName)}</strong><small>${escapeHtml(item.adminNote || '')}</small></div><span class="status ${statusClass(item.status)}">${escapeHtml(statusLabel(item.status))}</span></div>`).join('');
    return `<article class="transaction-card"><div class="transaction-head"><div><h3>${escapeHtml(typeLabel(tx.type))}</h3><div class="transaction-meta">${admin?`<span>${escapeHtml(tx.studentName)} · ${escapeHtml(tx.studentId)}</span>`:''}<span class="transaction-code">${escapeHtml(tx.code)}</span><span>${fmtDate(tx.createdAt)}</span><span>${tx.items.length} mục</span></div></div><span class="status ${statusClass(tx.status)}">${escapeHtml(statusLabel(tx.status))}</span></div>${tx.note?`<p>${escapeHtml(tx.note)}</p>`:''}<div class="transaction-items">${items}</div></article>`;
  }

  async function loadNotifications() {
    state.notifications = await api('listMyNotifications');
    $('#my-notifications').innerHTML = state.notifications.map(item => `<article class="notification-card ${item.read?'read':'unread'}"><div class="document-head"><div><h3 class="notification-title">${escapeHtml(item.title)}</h3><small>${fmtDate(item.createdAt)}</small></div></div><p>${escapeHtml(item.message)}</p><div class="notification-actions">${item.documentId?`<button class="link-button" onclick="window.app.openDocument('${item.documentId}')">Xem hồ sơ</button>`:''}${item.read?'':`<button class="link-button" onclick="window.app.readNotification('${item.notificationId}')">Đã đọc</button>`}</div></article>`).join('') || '<div class="empty">Chưa có thông báo nào.</div>';
  }

  async function openDocument(documentId) {
    try {
      const doc = await api('getDocumentDetail', documentId);
      const total = doc.steps.length || 1;
      const doneCount = doc.steps.filter(step => step.state === 'DONE').length;
      const currentIndex = doc.steps.findIndex(step => step.state === 'CURRENT');
      const stepNumber = currentIndex >= 0 ? currentIndex + 1 : Math.min(total, Math.max(1, doneCount));
      const timeline = doc.steps.length ? doc.steps.map(step => {
        const event = [...doc.events].reverse().find(evt => evt.toStepId === step.stepId);
        const attention = step.state === 'CURRENT' && doc.status === 'Yêu cầu bổ sung' ? ' attention' : '';
        return `<div class="timeline-step ${step.state.toLowerCase()}${attention}"><strong>${escapeHtml(step.name)}</strong><small>${event ? fmtDate(event.createdAt) : (step.state==='CURRENT'?'Đang làm':'')}</small>${event?.publicNote?`<div class="timeline-note">${escapeHtml(event.publicNote)}</div>`:''}</div>`;
      }).join('') : doc.events.map(evt => `<div class="timeline-step done"><strong>${escapeHtml(evt.status)}</strong><small>${fmtDate(evt.createdAt)}</small>${evt.publicNote?`<div class="timeline-note">${escapeHtml(evt.publicNote)}</div>`:''}</div>`).join('');
      openModal(`<h2 class="detail-title">${escapeHtml(doc.typeName)}</h2><div class="detail-meta"><code>${escapeHtml(doc.code)}</code><span class="status ${statusClass(doc.status)}">${escapeHtml(doc.status)}</span></div><div class="detail-facts"><div><small>Ghi nhận</small><strong>${fmtDay(doc.submittedAt)}</strong></div><div><small>Dự kiến xong</small><strong>${fmtDay(doc.expectedAt)}</strong></div></div><div class="detail-section-head"><span>Tiến độ</span><span>Bước ${stepNumber}/${total}</span></div><div class="timeline">${timeline}</div><p class="detail-updated">Cập nhật ${fmtDate(doc.updatedAt)}</p>`);
    } catch (error) { showAlert(error.message); }
  }

  async function readNotification(id) { await api('markNotificationRead', id); await loadNotifications(); }

  async function loadAdminHome() {
    const [boot, pending] = await Promise.all([api('getBootstrap'), api('listPendingTransactions')]);
    state.boot = boot; state.pending = pending; renderAdminKpis(boot.dashboard); renderQr();
    $('#admin-recent-pending').innerHTML = pending.slice(0,5).map(tx => `<button class="list-item" data-go="admin-pending"><div><strong>${escapeHtml(tx.studentName)} · ${escapeHtml(typeLabel(tx.type))}</strong><small><span class="list-code">${escapeHtml(tx.code)}</span> · ${fmtDate(tx.createdAt)}</small></div><span>${tx.items.filter(x=>x.status==='PENDING').length} mục</span></button>`).join('') || '<div class="empty">Không có yêu cầu nào đang chờ.</div>';
  }

  function renderQr() {
    if (!state.boot || state.boot.identity.role !== 'ADMIN') return;
    const url = state.boot.qrUrl || location.href;
    $('#qr-url').value = url;
    const target = $('#qr-code'); target.innerHTML = '';
    if (window.QRCode) QRCode.toCanvas(url, {width:180, margin:1, color:{dark:'#171717', light:'#ffffff'}}, (err, canvas) => { if (!err) target.appendChild(canvas); });
    else target.textContent = 'Không tạo được mã QR.';
  }

  async function loadPending() {
    state.pending = await api('listPendingTransactions');
    renderPendingTransactions();
  }

  function renderPendingTransactions() {
    const query = ($('#pending-search').value || '').trim().toLowerCase();
    const rows = state.pending.filter(tx => !query || `${tx.studentId} ${tx.studentName} ${tx.code}`.toLowerCase().includes(query));
    $('#pending-transactions').innerHTML = rows.map(adminTransactionCard).join('') || `<div class="empty">${query ? 'Không có yêu cầu nào khớp.' : 'Không có yêu cầu nào đang chờ.'}</div>`;
  }

  function adminTransactionCard(tx) {
    const items = tx.items.map(item => {
      const candidates = item.pickupCandidates || [];
      const candidateSelect = candidates.length > 1 ? `<select class="pickup-document-select" data-item-id="${escapeHtml(item.itemId)}"><option value="">Chọn hồ sơ cụ thể</option>${candidates.map(doc=>`<option value="${escapeHtml(doc.documentId)}">${escapeHtml(doc.code)} · ${fmtDate(doc.updatedAt)}</option>`).join('')}</select>` : candidates.length === 1 ? `<small>Sẽ bàn giao hồ sơ ${escapeHtml(candidates[0].code)}</small>` : '';
      return `<div class="transaction-item"><div class="review-item-main">${item.status==='PENDING'?`<input class="pending-item-select" type="checkbox" data-transaction-id="${escapeHtml(tx.transactionId)}" value="${escapeHtml(item.itemId)}" aria-label="Chọn ${escapeHtml(item.typeName)}" onchange="window.app.updatePendingSelection('${escapeHtml(tx.transactionId)}')">`:''}<div><strong>${escapeHtml(item.typeName)}</strong>${candidateSelect}${item.adminNote?`<small>${escapeHtml(item.adminNote)}</small>`:''}</div></div>${item.status==='PENDING'?`<button class="link-button danger" onclick="window.app.reviewItem('${item.itemId}','REJECT')">Từ chối</button>`:`<span class="status ${statusClass(item.status)}">${escapeHtml(statusLabel(item.status))}</span>`}</div>`;
    }).join('');
    const pendingCount = tx.items.filter(item => item.status === 'PENDING').length;
    return `<article class="transaction-card"><div class="transaction-head"><div><h3>${escapeHtml(tx.studentName)}</h3><div class="transaction-meta"><span>${escapeHtml(tx.studentId)} · ${escapeHtml(tx.className)}</span><span>${fmtDate(tx.createdAt)}</span><span>${escapeHtml(typeLabel(tx.type))} · <span class="transaction-code">${escapeHtml(tx.code)}</span></span></div></div><span class="status ${statusClass(tx.status)}">${escapeHtml(statusLabel(tx.status))}</span></div>${tx.note?`<p>${escapeHtml(tx.note)}</p>`:''}${pendingCount?`<div class="select-all-row"><span>${pendingCount} giấy tờ</span><button class="link-button" onclick="window.app.selectAllPending('${escapeHtml(tx.transactionId)}')">Chọn tất cả</button></div>`:''}<div class="transaction-items">${items}</div>${pendingCount?`<details><summary>Ghi chú và email</summary><label>Ghi chú</label><textarea id="review-note-${escapeHtml(tx.transactionId)}" rows="2"></textarea><label class="check-option"><input id="review-email-${escapeHtml(tx.transactionId)}" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label></details><div class="form-actions"><button id="approve-${escapeHtml(tx.transactionId)}" class="button primary" onclick="window.app.approveTransaction('${escapeHtml(tx.transactionId)}',this)" disabled>Xác nhận · 0</button></div>`:''}</article>`;
  }

  function updatePendingSelection(transactionId) {
    const count = $$(`.pending-item-select[data-transaction-id="${transactionId}"]:checked`).length;
    const button = $(`#approve-${transactionId}`);
    if (button) { button.textContent = `Xác nhận · ${count}`; button.disabled = count === 0; }
  }

  function selectAllPending(transactionId) {
    $$(`.pending-item-select[data-transaction-id="${transactionId}"]`).forEach(input => { input.checked = true; });
    updatePendingSelection(transactionId);
  }

  async function approveTransaction(transactionId, button) {
    const selected = $$(`.pending-item-select[data-transaction-id="${transactionId}"]:checked`);
    if (!selected.length) { toast('Chọn ít nhất một giấy tờ.', true); return; }
    const itemIds = selected.map(input => input.value);
    const documentSelections = {};
    for (const itemId of itemIds) {
      const select = $(`.pickup-document-select[data-item-id="${itemId}"]`);
      if (select) {
        if (!select.value) { toast('Chọn hồ sơ cụ thể cho mục có nhiều hồ sơ.', true); return; }
        documentSelections[itemId] = select.value;
      }
    }
    setBusy(button,true,'Đang xác nhận…');
    try {
      await api('reviewTransactionItems',{itemIds,decision:'APPROVE',note:$(`#review-note-${transactionId}`).value,sendEmail:$(`#review-email-${transactionId}`).checked,documentSelections});
      toast(`Đã xác nhận ${itemIds.length} giấy tờ.`); await loadPending();
    } catch(error) { toast(error.message,true); }
    finally { setBusy(button,false); }
  }

  function reviewItem(itemId, decision) {
    const title = decision === 'APPROVE' ? 'Xác nhận giấy tờ' : 'Từ chối giấy tờ';
    openModal(`<h2>${title}</h2><p>${decision==='APPROVE'?'Xác nhận sau khi đã đối chiếu sinh viên và giấy tờ thực tế tại quầy.':'Ghi lý do để sinh viên biết cần làm gì.'}</p><form id="review-form"><label>Ghi chú</label><textarea id="review-note" rows="4" ${decision==='REJECT'?'required':''}></textarea><label class="check-option"><input id="review-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button ${decision==='APPROVE'?'primary':'danger'}" type="submit">${title}</button></div></form>`);
    $('#review-form').addEventListener('submit', async event => {
      event.preventDefault(); const button=event.submitter; setBusy(button,true);
      try { await api('reviewTransactionItem',{itemId,decision,note:$('#review-note').value,sendEmail:$('#review-email').checked}); closeModal(); toast('Đã cập nhật yêu cầu.'); await loadPending(); }
      catch(error){ toast(error.message,true); } finally { setBusy(button,false); }
    });
  }

  async function loadAdminDocuments() {
    state.adminDocuments = await api('listDocuments',{query:$('#admin-document-search').value,status:$('#admin-document-status').value});
    $('#admin-documents-table').innerHTML = table(['','Mã hồ sơ','Sinh viên','Loại hồ sơ','Trạng thái','Cập nhật',''], state.adminDocuments.map(doc => [`<input class="document-select" type="checkbox" value="${escapeHtml(doc.documentId)}">`,`<span class="code">${escapeHtml(doc.code)}</span>`,`${escapeHtml(doc.studentName)}<small>${escapeHtml(doc.studentId)} · ${escapeHtml(doc.className)}</small>`,escapeHtml(doc.typeName),`<span class="status ${statusClass(doc.status)}">${escapeHtml(doc.status)}</span>`,fmtDate(doc.updatedAt),`<button class="link-button" onclick="window.app.editDocument('${doc.documentId}')">Cập nhật</button>`]));
    updateDocumentBulkActions();
  }

  function updateDocumentBulkActions() {
    const count = $$('.document-select:checked').length;
    $('#document-selection-count').textContent = `Đã chọn ${count} hồ sơ`;
    $('#document-bulk-actions').classList.toggle('hidden', count === 0);
  }

  function showManualDocumentForm(){
    const options=state.boot.types.map(type=>`<option value="${escapeHtml(type.typeId)}">${escapeHtml(type.name)}</option>`).join('');
    openModal(`<h2>Thêm hồ sơ tại văn phòng</h2><form id="manual-document-form"><label>Email hoặc MSSV sinh viên</label><input id="manual-document-student" required><label>Loại hồ sơ</label><select id="manual-document-type" required>${options}</select><label>Trạng thái ban đầu</label><select id="manual-document-status"><option>Đã tiếp nhận</option><option>Chờ sinh viên đến nhận</option><option>Đang xử lý</option></select><label>Ngày dự kiến</label><input id="manual-document-expected" type="date"><label>Phản hồi công khai</label><textarea id="manual-document-note"></textarea><label class="check-option"><input id="manual-document-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button primary" type="submit">Tạo hồ sơ</button></div></form>`);
    $('#manual-document-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{const value=$('#manual-document-student').value.trim();const student=value.includes('@')?{studentEmail:value}:{studentId:value};await api('createManualDocument',{...student,typeId:$('#manual-document-type').value,status:$('#manual-document-status').value,expectedAt:$('#manual-document-expected').value,publicNote:$('#manual-document-note').value,sendEmail:$('#manual-document-email').checked});closeModal();toast('Đã tạo hồ sơ.');await loadAdminDocuments();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  function showBatchDocumentForm(){
    const ids=$$('.document-select:checked').map(input=>input.value);if(!ids.length){toast('Chọn ít nhất một hồ sơ.',true);return;}
    const statuses=['Đang kiểm tra hồ sơ','Yêu cầu bổ sung','Đang xử lý','Đang trình duyệt','Chờ phê duyệt','Đã hoàn thành','Chờ sinh viên đến nhận'].map(s=>`<option>${s}</option>`).join('');
    openModal(`<h2>Cập nhật ${ids.length} hồ sơ</h2><form id="batch-document-form"><label>Trạng thái mới</label><select id="batch-status">${statuses}</select><label>Phản hồi công khai</label><textarea id="batch-note"></textarea><label class="check-option"><input id="batch-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button primary" type="submit">Cập nhật hàng loạt</button></div></form>`);
    $('#batch-document-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('batchUpdateDocuments',{documentIds:ids,status:$('#batch-status').value,publicNote:$('#batch-note').value,sendEmail:$('#batch-email').checked});closeModal();toast('Đã cập nhật các hồ sơ đã chọn.');await loadAdminDocuments();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  async function editDocument(documentId) {
    try {
      const [doc, workflows] = await Promise.all([api('getDocumentDetail',documentId), state.workflows.length?Promise.resolve(state.workflows):api('listWorkflows')]);
      state.workflows=workflows;
      const workflow=workflows.find(w=>w.workflowVersionId===state.adminDocuments.find(x=>x.documentId===documentId)?.workflowVersionId);
      const steps=(workflow?.steps||doc.steps||[]).map(step=>`<option value="${escapeHtml(step.stepId)}" ${step.stepId===state.adminDocuments.find(x=>x.documentId===documentId)?.currentStepId?'selected':''}>${escapeHtml(step.order+'. '+step.name)}</option>`).join('');
      const statuses=['Đã tiếp nhận','Đang kiểm tra hồ sơ','Yêu cầu bổ sung','Đang xử lý','Đang trình duyệt','Chờ phê duyệt','Đã hoàn thành','Chờ sinh viên đến nhận','Đã bàn giao'].map(s=>`<option ${s===doc.status?'selected':''}>${s}</option>`).join('');
      openModal(`<h2>Cập nhật ${escapeHtml(doc.code)}</h2><p>${escapeHtml(doc.typeName)}</p><form id="document-update-form"><label>Bước xử lý</label><select id="doc-step"><option value="">Giữ nguyên bước hiện tại</option>${steps}</select><label>Trạng thái</label><select id="doc-status">${statuses}</select><label>Ngày hoàn thành dự kiến</label><input id="doc-expected" type="date" value="${doc.expectedAt?doc.expectedAt.slice(0,10):''}"><label>Phản hồi công khai</label><textarea id="doc-public-note" rows="3">${escapeHtml(doc.publicNote||'')}</textarea><label>Ghi chú nội bộ</label><textarea id="doc-internal-note" rows="3">${escapeHtml(doc.internalNote||'')}</textarea><label class="check-option"><input id="doc-send-email" type="checkbox"><span><strong>Gửi email cho sinh viên</strong><small>Thông báo trong ứng dụng luôn được gửi.</small></span></label><div class="form-actions"><button class="button primary" type="submit">Lưu cập nhật</button></div></form>`);
      $('#document-update-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('updateDocumentProgress',{documentId,version:doc.version,stepId:$('#doc-step').value,status:$('#doc-status').value,expectedAt:$('#doc-expected').value,publicNote:$('#doc-public-note').value,internalNote:$('#doc-internal-note').value,sendEmail:$('#doc-send-email').checked});closeModal();toast('Đã cập nhật tiến độ hồ sơ.');await loadAdminDocuments();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
    } catch(error){showAlert(error.message);}
  }

  async function loadCatalog() {
    const [types,workflows]=await Promise.all([api('listDocumentTypes',true),api('listWorkflows')]);
    state.workflows=workflows; state.types=types; state.boot.types=types.filter(x=>x.active);
    const handoverLabel={SUBMIT:'Nộp',RECEIVE:'Nhận',BOTH:'Nộp và nhận'};
    $('#document-types-admin').innerHTML=types.map(item=>`<div class="list-item"><div><strong>${escapeHtml(item.name)}</strong><small>${escapeHtml(handoverLabel[item.handoverMode]||'Nộp và nhận')} · ${item.tracksProgress?'Theo dõi tiến độ':'Chỉ ghi nhận'} · ${item.active?'Đang sử dụng':'Ngừng sử dụng'}</small></div><div class="review-actions"><button class="link-button" onclick="window.app.editType('${escapeHtml(item.typeId)}')">Sửa</button><button class="link-button danger" onclick="window.app.deleteType('${escapeHtml(item.typeId)}')">Xóa</button></div></div>`).join('')||'<div class="empty">Chưa có loại hồ sơ.</div>';
    $('#workflows-admin').innerHTML=workflows.map(w=>`<div class="list-item"><div><strong>${escapeHtml(w.name)}</strong><small>Phiên bản ${w.version} · ${w.steps.length} bước</small></div><button class="link-button" onclick="window.app.viewWorkflow('${w.workflowVersionId}')">Xem</button></div>`).join('')||'<div class="empty">Chưa có quy trình.</div>';
  }

  function showTypeForm(item={}) {
    const options=state.workflows.map(w=>`<option value="${escapeHtml(w.workflowVersionId)}" ${w.workflowVersionId===item.workflowVersionId?'selected':''}>${escapeHtml(w.name)} · v${w.version}</option>`).join('');
    const mode=item.handoverMode||'SUBMIT';
    openModal(`<h2>${item.typeId?'Chỉnh sửa':'Thêm'} loại hồ sơ</h2><form id="type-form"><label>Tên loại hồ sơ</label><input id="type-name" value="${escapeHtml(item.name||'')}" required><label>Hình thức</label><select id="type-handover-mode"><option value="SUBMIT" ${mode==='SUBMIT'?'selected':''}>Sinh viên nộp</option><option value="RECEIVE" ${mode==='RECEIVE'?'selected':''}>Sinh viên nhận</option><option value="BOTH" ${mode==='BOTH'?'selected':''}>Cả nộp và nhận</option></select><label>Kiểu theo dõi</label><select id="type-tracking"><option value="NO" ${!item.tracksProgress?'selected':''}>Chỉ ghi nhận giao nhận</option><option value="YES" ${item.tracksProgress?'selected':''}>Có tiến độ xử lý</option></select><details class="advanced-options"><summary>Tùy chọn nâng cao</summary><label>Mô tả</label><textarea id="type-description">${escapeHtml(item.description||'')}</textarea><label>Quy trình</label><select id="type-workflow"><option value="">Dùng quy trình chuẩn</option>${options}</select><label>Thứ tự</label><input id="type-order" type="number" min="1" value="${Number(item.sortOrder||'')}"><label class="check-option"><input id="type-active" type="checkbox" ${item.active!==false?'checked':''}><span><strong>Đang sử dụng</strong></span></label></details><div class="form-actions"><button class="button primary" type="submit">Lưu loại hồ sơ</button></div></form>`);
    $('#type-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('saveDocumentType',{typeId:item.typeId||'',name:$('#type-name').value,handoverMode:$('#type-handover-mode').value,description:$('#type-description').value,tracksProgress:$('#type-tracking').value==='YES',workflowVersionId:$('#type-workflow').value,sortOrder:Number($('#type-order').value)||undefined,active:$('#type-active').checked});closeModal();toast('Đã lưu loại hồ sơ.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }
  function editTypeById(typeId){showTypeForm(state.types.find(item=>item.typeId===typeId)||{});}

  function confirmDeleteType(typeId) {
    const item=state.types.find(type=>type.typeId===typeId);
    if(!item){toast('Không tìm thấy loại hồ sơ.',true);return;}
    openModal(`<h2>Xóa ${escapeHtml(item.name)}?</h2><div class="inline-warning">Chỉ xóa được loại chưa có hồ sơ hay yêu cầu nào. Nếu đã dùng, chọn “Ngừng sử dụng” để giữ lịch sử.</div><form id="delete-type-form"><div class="form-actions"><button id="cancel-delete-type" class="button" type="button">Hủy</button><button class="button danger" type="submit">Xóa loại hồ sơ</button></div></form>`);
    $('#cancel-delete-type').addEventListener('click',closeModal);
    $('#delete-type-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true,'Đang xóa…');try{await api('deleteDocumentType',typeId);closeModal();toast('Đã xóa loại hồ sơ.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  function showWorkflowForm() {
    openModal(`<h2>Tạo phiên bản quy trình</h2><p>Quy trình mới không ảnh hưởng hồ sơ đang xử lý.</p><form id="workflow-form"><label>Tên quy trình</label><input id="workflow-name" required><label>Các bước xử lý</label><div id="workflow-steps"></div><button id="add-workflow-step" type="button" class="button small">Thêm bước</button><div class="form-actions"><button class="button primary" type="submit">Tạo quy trình</button></div></form>`);
    const add=()=>{$('#workflow-steps').insertAdjacentHTML('beforeend',`<div class="grid two-col compact workflow-step-input"><input placeholder="Tên bước" required><input placeholder="Nhãn trạng thái" required></div>`)}; add(); add();
    $('#add-workflow-step').addEventListener('click',add);
    $('#workflow-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{const steps=$$('.workflow-step-input').map(row=>({name:$('input:first-child',row).value,statusLabel:$('input:last-child',row).value}));await api('saveWorkflow',{name:$('#workflow-name').value,steps});closeModal();toast('Đã tạo quy trình.');await loadCatalog();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}});
  }

  function viewWorkflow(id) { const w=state.workflows.find(x=>x.workflowVersionId===id); if(!w)return; openModal(`<h2>${escapeHtml(w.name)}</h2><p>Phiên bản ${w.version}</p><div class="timeline">${w.steps.map(step=>`<div class="timeline-step done"><strong>${step.order}. ${escapeHtml(step.name)}</strong><small>${escapeHtml(step.statusLabel)}</small></div>`).join('')}</div>`); }

  async function loadService() {
    const [active,sessions]=await Promise.all([api('getActiveServiceSession'),api('listServiceSessions',{query:$('#service-search').value})]);
    renderServiceRecorder(active); renderServiceHistory(sessions);
  }

  function renderServiceRecorder(active) {
    clearInterval(state.serviceTimer);
    if(active){$('#service-recorder').innerHTML=`<div class="timer"><span>${escapeHtml(active.studentName)} · ${escapeHtml(active.studentId)}</span><strong id="timer-value">00:00:00</strong><button class="button primary" onclick="window.app.finishService('${active.sessionId}')">Kết thúc buổi tiếp</button></div>`;const start=new Date(active.startedAt).getTime();const tick=()=>{const seconds=Math.max(0,Math.floor((Date.now()-start)/1000));$('#timer-value').textContent=[Math.floor(seconds/3600),Math.floor(seconds%3600/60),seconds%60].map(x=>String(x).padStart(2,'0')).join(':')};tick();state.serviceTimer=setInterval(tick,1000);}else{$('#service-recorder').innerHTML=`<form id="start-service-form"><label>Email hoặc MSSV sinh viên</label><input id="live-student" required><button class="button primary" type="submit">Bắt đầu tiếp sinh viên</button></form>`;$('#start-service-form').addEventListener('submit',async event=>{event.preventDefault();const value=$('#live-student').value.trim();const button=event.submitter;setBusy(button,true);try{const payload=value.includes('@')?{studentEmail:value}:{studentId:value};await api('startServiceSession',payload);await loadService();}catch(error){showAlert(error.message);}finally{setBusy(button,false);}});}
  }

  function finishService(sessionId) { openModal(`<h2>Kết thúc buổi tiếp sinh viên</h2><form id="finish-service-form"><label>Nội dung trao đổi</label><textarea id="finish-topic" required></textarea><label>Kết quả xử lý</label><textarea id="finish-result" required></textarea><label>Ghi chú</label><textarea id="finish-note"></textarea><div class="form-actions"><button class="button primary" type="submit">Lưu buổi tiếp</button></div></form>`);$('#finish-service-form').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('finishServiceSession',{sessionId,topic:$('#finish-topic').value,result:$('#finish-result').value,note:$('#finish-note').value});closeModal();toast('Đã lưu buổi tiếp sinh viên.');await loadService();}catch(error){toast(error.message,true);}finally{setBusy(button,false);}}); }

  async function saveManualService(event) { event.preventDefault();const button=event.submitter;setBusy(button,true);try{const value=$('#manual-student').value.trim();const student=value.includes('@')?{studentEmail:value}:{studentId:value};await api('addManualServiceSession',{...student,startedAt:$('#manual-start').value,result:$('#manual-result').value,endedAt:$('#manual-end').value,topic:$('#manual-topic').value});event.target.reset();toast('Đã lưu buổi tiếp sinh viên.');await loadServiceHistory();}catch(error){showAlert(error.message);}finally{setBusy(button,false);} }
  async function loadServiceHistory(){const sessions=await api('listServiceSessions',{query:$('#service-search').value});renderServiceHistory(sessions);}
  function renderServiceHistory(sessions){$('#service-history').innerHTML=table(['Sinh viên','Thời gian','Thời lượng','Nội dung','Kết quả','Cán bộ'],sessions.map(row=>[`${escapeHtml(row.studentName)}<small>${escapeHtml(row.studentId)} · ${escapeHtml(row.className)}</small>`,fmtDate(row.startedAt),`${row.durationMinutes} phút`,escapeHtml(row.topic),escapeHtml(row.result),escapeHtml(row.staffEmail)]));}

  async function loadStudents(){const rows=await api('listStudents',$('#student-search').value);$('#students-table').innerHTML=table(['MSSV','Họ tên','Lớp','Email','Cập nhật'],rows.map(row=>[escapeHtml(row.studentId),escapeHtml(row.fullName),escapeHtml(row.className),escapeHtml(row.email),fmtDate(row.updatedAt)]));}

  async function loadReport(){const report=await api('getReport',{from:$('#report-from').value,to:$('#report-to').value});$('#report-kpis').innerHTML=kpis([['Yêu cầu đã gửi',report.requestCount],['Còn chờ xác nhận',report.pendingRequestCount],['Giấy tờ đã nộp',report.submittedCount],['Giấy tờ đã nhận',report.receivedCount],['Giấy tờ xác nhận',report.approvedItemCount],['Đang xử lý',report.processingDocuments],['Cần bổ sung',report.supplementDocuments],['Đã hoàn thành',report.completedDocuments]]);}
  async function exportReport(){try{const csv=await api('exportReportCsv',{from:$('#report-from').value,to:$('#report-to').value});const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`bao-cao-ho-so-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);}catch(error){showAlert(error.message);}}

  async function loadSettings(){const settings=await api('getSettings');$('#setting-app-name').value=settings.APP_NAME||'';$('#setting-office-name').value=settings.OFFICE_NAME||'';}
  async function saveSettings(event){event.preventDefault();const button=event.submitter;setBusy(button,true);try{await api('saveSettings',{APP_NAME:$('#setting-app-name').value,OFFICE_NAME:$('#setting-office-name').value});toast('Đã lưu.');state.boot=await api('getBootstrap');renderShell();}catch(error){showAlert(error.message);}finally{setBusy(button,false);}}
  async function runHealthCheck(){const button=$('#health-check');setBusy(button,true);try{$('#health-result').textContent=JSON.stringify(await api('healthCheck'),null,2);}catch(error){$('#health-result').textContent=error.message;}finally{setBusy(button,false);}}

  function table(headers, rows){if(!rows.length)return '<div class="empty">Không có dữ liệu.</div>';return `<table class="data-table"><thead><tr>${headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(cell=>`<td>${cell}</td>`).join('')}</tr>`).join('')}</tbody></table>`;}

  window.app = {openDocument, readNotification, reviewItem, approveTransaction, updatePendingSelection, selectAllPending, editDocument, editType:editTypeById, deleteType:confirmDeleteType, viewWorkflow, finishService};
  initialize();
})();
</script>
