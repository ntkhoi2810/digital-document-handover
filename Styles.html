<style>
:root{
  color-scheme:light;
  --bg:#FBFBFA;--surface:#FFFFFF;--hover:#F6F6F3;--selected:#F3F3F0;
  --line:#E8E8E5;--line-strong:#D8D8D3;
  --ink:#171717;--ink-hover:#2E2E2E;--ink-2:#5C5C58;--ink-3:#72726C;--ink-status:#3F3F3B;--on-ink:#FFFFFF;
  --accent:#1E4E8C;--accent-bg:#EEF3F9;
  --ok:#2F7D5B;--act:#B7791F;--prog:#1E4E8C;--bad:#B3382C;--neutral:#A3A39D;
  --bad-bg:#FBEDEA;--act-bg:#F6ECD8;--note-bg:#F5F5F3;--timeline-line:#E1E1DD;--timeline-empty:#BDBDB7;
  --nav-hover:#F1F1EE;--nav-active:#EEEEEA;--overlay:rgba(23,23,23,.32);--mobile-nav:rgba(251,251,250,.94);--error-dot:#F08C80;
  --r-sm:6px;--r:10px;--sidebar:232px;--shadow-float:0 12px 40px rgba(23,23,23,.12);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.hidden{display:none!important}
.view{display:none}
.view.active-view{display:block}

.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);display:flex;flex-direction:column;gap:28px;padding:24px 12px 16px;background:var(--bg);border-right:1px solid var(--line);z-index:20}
.brand{display:block;padding:0 10px}
.brand strong{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em}
.brand span{display:block;margin-top:1px;color:var(--ink-3);font-size:12px}
.nav-list{display:flex;flex-direction:column;gap:1px}
.nav-item{display:flex;align-items:center;justify-content:space-between;width:100%;height:32px;padding:0 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--ink-2);font-size:13.5px;font-weight:500;text-align:left;transition:background-color .12s,color .12s}
.nav-item:hover{background:var(--nav-hover);color:var(--ink)}
.nav-item.active{background:var(--nav-active);color:var(--ink)}
.nav-item .ico{display:none}
.badge{margin-left:auto;padding:0;background:none;color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.sidebar-user{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line)}
.sidebar-user strong,.sidebar-user small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user strong{font-size:13px;font-weight:500}
.sidebar-user small{color:var(--ink-3);font-size:12px}

.main{min-height:100vh;margin-left:var(--sidebar);padding:56px 56px 72px}
[data-role="STUDENT"] .view{max-width:720px;margin:0 auto}
[data-role="ADMIN"] .view{max-width:1080px}
.page-head{display:flex;align-items:flex-start;gap:12px;max-width:1080px;margin:0 0 32px}
[data-role="STUDENT"] .page-head{max-width:720px;margin-left:auto;margin-right:auto}
.page-head h1{font-size:26px;font-weight:600;line-height:1.2;letter-spacing:-.024em}
.page-head p{margin-top:6px;color:var(--ink-2);font-size:13px}
#page-subtitle:empty{display:none}
.icon-button{display:none;width:36px;height:36px;padding:7px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.icon-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.page-note{min-height:0;margin:-16px 0 20px;color:var(--ink-2);font-size:13.5px}
.page-note:empty{display:none}
.page-note .link-button{margin-left:8px}

.button{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-size:13.5px;font-weight:500;white-space:nowrap;transition:background-color .12s}
.button:hover{background:var(--hover);transform:none}
.button.primary{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.button.primary:hover{background:var(--ink-hover)}
.button.danger{border-color:transparent;background:none;color:var(--bad)}
.button.danger:hover{background:var(--bad-bg)}
.button.small{height:30px;padding:0 10px;font-size:13px}
.button:disabled{cursor:not-allowed;opacity:.35}
.link-button{border:0;background:none;padding:0;color:var(--accent);font-weight:500}
.link-button:hover{text-decoration:underline;text-underline-offset:3px}
.link-button.danger{color:var(--bad)}

input,select,textarea{width:100%;height:36px;padding:0 12px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
textarea{height:auto;min-height:88px;padding:10px 12px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
input:disabled,input[readonly]{background:var(--hover);color:var(--ink-3)}
form>label,.form-card label,.modal-panel form label{display:block;margin:24px 0 8px;color:var(--ink-2);font-size:13px;font-weight:500}
.form-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:24px}
.form-card,.panel{padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.form-card.narrow{max-width:560px}
.narrow{max-width:560px}

.segmented{display:flex;gap:28px;margin:0 0 8px;border-bottom:1px solid var(--line)}
.segmented label{margin:0;cursor:pointer}
.segmented input{position:absolute;opacity:0;pointer-events:none}
.segmented span{display:block;margin-bottom:-1px;padding:0 0 12px;border-bottom:2px solid transparent;color:var(--ink-3);font-weight:500}
.segmented label:hover span{color:var(--ink)}
.segmented input:checked+span{border-bottom-color:var(--ink);color:var(--ink)}
.checklist{display:block;margin:0 -12px}
.check-option{display:flex!important;align-items:flex-start;gap:14px;margin:0!important;padding:16px 12px;border:0;border-bottom:1px solid var(--line);border-radius:0;cursor:pointer}
.check-option:hover{background:var(--hover)}
.check-option:has(input:checked){background:var(--selected)}
.check-option input{flex:none;width:16px;height:16px;margin:2px 0 0;padding:0;accent-color:var(--ink)}
.check-option span,.check-option strong,.check-option small{display:block}
.check-option strong{font-weight:500}
.check-option small{margin-top:2px;color:var(--ink-3);font-weight:400}
.transaction-form>label{margin-top:32px}
.transaction-footer{justify-content:space-between;padding-top:20px;border-top:1px solid var(--line)}
.transaction-footer>span{color:var(--ink-2);font-size:13px}

.status{display:inline-flex;align-items:center;gap:8px;padding:0;background:none;border-radius:0;color:var(--ink-status);font-size:13px;font-weight:400;white-space:nowrap}
.status:before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--neutral)}
.status.ok:before{background:var(--ok)}
.status.act:before{background:var(--act)}
.status.prog:before{background:var(--prog)}
.status.bad:before{background:var(--bad)}

.section-block{margin-top:40px}
.section-head,.card-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}
.section-head h2,.card-head h2{color:var(--ink-3);font-size:13px;font-weight:500}
.card-head p{display:none}
.card{padding:0;border:0;border-radius:0;background:none;box-shadow:none}
.list,.cards-list{margin:0 -12px;border-top:1px solid var(--line)}
.list-item,.transaction-card,.document-card,.notification-card{width:100%;padding:14px 12px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;color:var(--ink);text-align:left}
button.list-item,button.document-card{cursor:pointer}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:20px}
.list-item:hover,button.document-card:hover{background:var(--hover)}
.list-item strong,.list-item small{display:block}
.list-item strong{font-weight:500}
.list-item small{margin-top:2px;color:var(--ink-3);font-size:12.5px}
.list-code,.document-code,.transaction-code,.data-table .code{font-family:var(--mono);font-size:12px}
.empty{padding:32px 0;color:var(--ink-3);text-align:left}
.cards-list>.empty{margin:0 12px}
.home-action{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:40px}
.home-action h2{font-size:16px;font-weight:600;letter-spacing:-.01em}
.home-action p{max-width:470px;margin-top:5px;color:var(--ink-2);font-size:13px}

.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:0;border-top:1px solid var(--line)}
.kpi{padding:18px 0 18px 20px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.kpi:nth-child(4n+1){padding-left:0;border-left:0}
.kpi strong,.kpi span{display:block}
.kpi strong{font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--ink-2);font-size:13px}
.report-kpis{margin-top:32px}

.toolbar{display:flex;align-items:flex-end;gap:8px;margin-bottom:24px}
.toolbar input[type="search"]{max-width:380px}
.toolbar select{max-width:220px}
.toolbar-push{margin-left:auto}
.student-toolbar input[type="search"]{max-width:none}
.history-link{margin-top:24px}
.grid{display:grid;gap:32px}
.grid.two-col{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.compact{gap:12px}
.admin-home-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:48px}
.qr-panel{margin-top:40px}
.qr-admin{display:flex;align-items:flex-end;gap:20px}
#qr-code{flex:none;width:180px;height:180px;background:var(--surface)}
#qr-code canvas{display:block;width:180px!important;height:180px!important}
.qr-controls{display:flex;flex:1;flex-direction:column;align-items:flex-start;gap:12px;min-width:0}
.qr-controls input{font-family:var(--mono);font-size:11px}

.document-card{display:block}
.document-head,.transaction-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.document-head h3,.transaction-head h3{font-size:14px;font-weight:500}
.document-meta,.transaction-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:3px;color:var(--ink-3);font-size:12.5px}
.document-meta span:first-child,.transaction-head h3 .code{font-family:var(--mono);font-size:12px}
.document-card>p,.transaction-card>p,.notification-card>p{margin-top:8px;color:var(--ink-2);font-size:13px}
.transaction-card{padding-top:18px;padding-bottom:18px}
.transaction-head h3{font-size:15px}
.transaction-items{margin-top:14px;border-top:1px solid var(--line)}
.transaction-item{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;padding:12px 0;border-bottom:1px solid var(--line)}
.transaction-item:last-child{border-bottom:0}
.transaction-item strong,.transaction-item small{display:block}
.transaction-item strong{font-weight:500}
.transaction-item small{margin-top:3px;color:var(--ink-3);font-size:12.5px}
.review-item-main{display:flex;align-items:flex-start;gap:12px;min-width:0}
.review-item-main>input{flex:none;width:16px;height:16px;margin:3px 0 0;accent-color:var(--ink)}
.review-item-main>div{min-width:0}
.review-item-main select{margin-top:8px}
.review-actions{display:flex;align-items:center;gap:12px}
.pending-list>.transaction-card{margin-bottom:16px;padding:20px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.pending-list>.transaction-card:last-child{margin-bottom:0}
.select-all-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-bottom:4px}
.select-all-row span{color:var(--ink-3);font-size:12.5px}
details{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
summary{color:var(--accent);font-size:13px;font-weight:500;cursor:pointer}
.notification-card.unread .notification-title:before{content:"";display:inline-block;width:6px;height:6px;margin:0 8px 2px 0;border-radius:50%;background:var(--accent)}
.notification-card.read .notification-title{color:var(--ink-2)}
.notification-actions{display:flex;gap:16px;margin-top:12px}

.table-wrap{overflow-x:auto;border:0;border-radius:0;background:none}
.data-table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.data-table th{padding:0 12px 10px;border-bottom:1px solid var(--line);background:none;color:var(--ink-3);font-size:12.5px;font-weight:500;text-align:left;white-space:nowrap}
.data-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.data-table tbody tr:hover td{background:var(--hover)}
.data-table small{display:block;color:var(--ink-3);font-size:12.5px}
.data-table input[type="checkbox"]{width:16px;height:16px;padding:0;accent-color:var(--ink)}
.bulk-actions{display:flex;align-items:center;gap:18px;margin-bottom:12px;padding:10px 14px;border-radius:8px;background:var(--ink);color:var(--on-ink)}
.bulk-actions span{margin-right:auto;font-size:13px;font-weight:500}
.bulk-button{padding:0;border:0;background:none;color:var(--on-ink);font-size:13px;font-weight:500}
.bulk-button:hover{text-decoration:underline;text-underline-offset:3px}

.timeline{margin:20px 0 0;padding:0}
.timeline-step{position:relative;padding:0 0 26px 28px;border:0}
.timeline-step:before{content:"";position:absolute;left:0;top:6px;width:7px;height:7px;border:0;border-radius:50%;background:var(--ink);box-shadow:none;animation:none}
.timeline-step:after{content:"";position:absolute;left:3px;top:10px;bottom:-4px;width:1px;background:var(--timeline-line)}
.timeline-step:last-child:after{display:none}
.timeline-step.current:before{left:-1px;top:5px;width:9px;height:9px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.timeline-step.current.attention:before{background:var(--act);box-shadow:0 0 0 3px var(--act-bg)}
.timeline-step:not(.done):not(.current):before{background:var(--bg);border:1px solid var(--timeline-empty)}
.timeline-step:not(.done):not(.current) strong{color:var(--ink-3)}
.timeline-step strong,.timeline-step small{display:block}
.timeline-step strong{font-size:14px;font-weight:500}
.timeline-step small{margin-top:2px;color:var(--ink-3);font-size:12.5px}
.timeline-note{margin-top:10px;padding:12px 14px;border-radius:var(--r-sm);background:var(--note-bg);font-size:13.5px}
.detail-title{font-size:22px!important;font-weight:600!important;letter-spacing:-.02em}
.detail-meta{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:6px}
.detail-meta code{color:var(--ink-3);font:12px var(--mono)}
.detail-facts{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin:24px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.detail-facts small,.detail-facts strong{display:block}
.detail-facts small{color:var(--ink-3);font-size:12.5px}
.detail-facts strong{margin-top:3px;font-weight:500}
.detail-section-head{display:flex;align-items:center;justify-content:space-between;color:var(--ink-3);font-size:13px;font-weight:500}
.detail-updated{margin-top:4px;color:var(--ink-3);font-size:12.5px}

.timer{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.timer span{color:var(--ink-2)}
.timer strong{font-size:40px;font-weight:500;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.service-history-block{margin-top:48px}
.service-history-block .section-head input{max-width:300px}
.report-toolbar>div{min-width:160px}
.report-toolbar label{display:block;margin-bottom:6px;color:var(--ink-2);font-size:13px;font-weight:500}
.health-result{min-height:100px;margin:16px 0 0;padding:14px;overflow:auto;border-radius:var(--r-sm);background:var(--hover);color:var(--ink-2);font:12px/1.6 var(--mono);white-space:pre-wrap}

.alert,.inline-warning{display:flex;gap:10px;margin-bottom:24px;padding:12px 14px;border:0;border-radius:var(--r-sm);background:var(--hover);color:var(--ink)}
.alert:before,.inline-warning:before{content:"";flex:none;width:6px;height:6px;margin-top:8px;border-radius:50%;background:var(--bad)}
.inline-warning:before{background:var(--act)}
.alert.success:before{background:var(--ok)}
.loading-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--bg);color:var(--ink-3);font-size:13px}
.spinner{width:16px;height:16px;border:1.5px solid var(--line-strong);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.access-error{width:min(520px,calc(100% - 40px));padding:24px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.access-error h2{font-size:20px;font-weight:600}
.access-error p{margin-top:8px;color:var(--ink-2)}
.access-error .button{margin-top:20px}
.toast{position:fixed;z-index:80;left:50%;right:auto;bottom:24px;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:13.5px;box-shadow:var(--shadow-float)}
.toast.error{background:var(--ink)}
.toast.error:before{content:"";display:inline-block;width:6px;height:6px;margin-right:10px;border-radius:50%;background:var(--error-dot)}
.modal{position:fixed;inset:0;z-index:60;display:flex;justify-content:flex-end;padding:0;background:var(--overlay)}
.modal-panel{position:relative;width:min(480px,100%);height:100%;max-height:none;padding:32px 28px;overflow:auto;border-radius:0;background:var(--surface);box-shadow:var(--shadow-float)}
.modal-panel h2{padding-right:36px;font-size:20px;font-weight:600;letter-spacing:-.02em}
.modal-panel>p{margin-top:6px;color:var(--ink-2)}
.modal-close{position:absolute;top:20px;right:20px;width:32px;height:32px;padding:0;border:0;background:none;color:var(--ink-3);font-size:24px;line-height:1}

@media(max-width:980px){
  .main{padding-right:32px;padding-left:32px}
  .admin-home-grid{grid-template-columns:1fr}
  .qr-panel{margin-top:0}
  .grid.two-col{grid-template-columns:1fr}
}

@media(max-width:760px){
  .main{margin-left:0;padding:20px 20px calc(96px + env(safe-area-inset-bottom))}
  .page-head{align-items:center;margin-bottom:28px}
  .page-head h1{font-size:24px}
  [data-role="STUDENT"] .sidebar{display:contents}
  [data-role="STUDENT"] .brand,[data-role="STUDENT"] .sidebar-user,[data-role="STUDENT"] #admin-nav{display:none}
  [data-role="STUDENT"] #student-nav{position:fixed;z-index:50;inset:auto 0 0 0;display:grid!important;grid-template-columns:repeat(5,1fr);gap:0;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--mobile-nav);backdrop-filter:blur(12px)}
  [data-role="STUDENT"] #student-nav .nav-history{display:none}
  [data-role="STUDENT"] #student-nav .nav-item{position:relative;flex-direction:column;justify-content:center;gap:3px;height:52px;padding:0 2px;border-radius:var(--r-sm);font-size:11px;font-weight:500;text-align:center}
  [data-role="STUDENT"] #student-nav .nav-item .ico{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  [data-role="STUDENT"] #student-nav .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:16px;padding:0 4px;border-radius:8px;background:var(--ink);color:var(--on-ink);font-size:10px;line-height:16px}
  [data-role="ADMIN"] .sidebar{transform:translateX(-100%);transition:transform .16s}
  [data-role="ADMIN"] .sidebar.open{transform:translateX(0)}
  [data-role="ADMIN"] .icon-button{display:inline-flex;flex:none}
  .page-note{margin-top:-12px}
  .toolbar{align-items:stretch;flex-direction:column}
  .toolbar input[type="search"],.toolbar select{max-width:none}
  .toolbar-push{margin-left:0}
  .button,input,select{min-height:44px}
  .button.small{min-height:40px}
  .link-button{min-height:44px}
  .section-head .link-button{min-height:0}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(4n+1){padding-left:20px;border-left:1px solid var(--line)}
  .kpi:nth-child(2n+1){padding-left:0;border-left:0}
  .home-action{align-items:stretch;flex-direction:column}
  .home-action .button{align-self:flex-start}
  .segmented{gap:20px;overflow-x:auto}
  .segmented label{flex:none}
  .transaction-footer{align-items:stretch;flex-direction:column}
  .transaction-footer .button{width:100%}
  .document-head,.transaction-head{gap:12px}
  .pending-list>.transaction-card{padding:16px 12px}
  .transaction-item{gap:12px}
  .review-item-main{flex:1}
  .admin-home-grid{gap:32px}
  .qr-admin{align-items:flex-start;flex-direction:column}
  .qr-controls{width:100%}
  .bulk-actions{align-items:flex-start;flex-wrap:wrap}
